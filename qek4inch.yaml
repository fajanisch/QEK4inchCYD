esphome:
  name: qek-cyd-40
  friendly_name: "QEK Dashboard 4.0"
  on_boot:
    priority: -200.0
    then:
      - output.turn_on: audio_amp_enable
      - delay: 5s
      - if:
          condition:
            binary_sensor.is_on: ha_auto_dim
          then:
            - logger.log: "Boot-Sync: Auto-Dim ist ON -> Starte Timer"
            - script.execute: dim_inactivity_timer

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_OPI: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "QEK-Display-Fallback"

api:
  encryption:
    key: !secret qek_cyd_40__encryption_key

ota:
  - platform: esphome
    encryption:

spi:
  - id: spi_display
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi_display
    model: ST7796
    dimensions:
      width: 320
      height: 480
    cs_pin: GPIO10
    dc_pin: GPIO46
    data_rate: 40MHz
    invert_colors: true
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm
    frequency: 1000Hz
  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
    id: audio_amp_enable

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    pin: GPIO42
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    name: "Board Status LED"
    id: cyd_rgb_led
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms
    effects:
      - pulse:
          name: "Status Pulse"
          transition_length: 800ms
          update_interval: 1s
      - strobe:
          name: "Alarm Strobe"
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms

i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

touchscreen:
  - platform: ft63x6
    id: my_touch
    display: my_display
    reset_pin: GPIO18
    on_touch:
      then:
        - if:
            condition:
              binary_sensor.is_on: ha_auto_dim
            then:
              - script.execute: dim_inactivity_timer

i2s_audio:
  - id: i2s_audio_bus
    i2s_mclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
    i2s_lrclk_pin: GPIO7

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: cyd_speaker
    dac_type: external
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    audio_dac: es8311_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
  
media_player:
  - platform: speaker
    name: "CYD QEK Speaker"
    id: cyd_qek_speaker
    announcement_pipeline:
      speaker: cyd_speaker
      format: FLAC

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lvgl.label.update:
            id: lbl_status_datetime
            text: !lambda |-
              auto now = id(ha_time).now();
              if (!now.is_valid()) return std::string("--, -- ---  --:--");
              char buf[32];
              time_t t = now.timestamp;
              struct tm *timeinfo = localtime(&t);
              strftime(buf, sizeof(buf), "%a, %d %b  %H:%M", timeinfo);
              return std::string(buf);
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lbl_status_datetime
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("--, -- ---  --:--");
                char buf[32];
                time_t t = now.timestamp;
                struct tm *timeinfo = localtime(&t);
                strftime(buf, sizeof(buf), "%a, %d %b  %H:%M", timeinfo);
                return std::string(buf);

globals:
  - id: forecast_mode
    type: int
    initial_value: '0'  # 0 = Stündlich (Hourly), 1 = Täglich (Daily)
    
packages:
  sensors: !include sensors.yaml
  scripts: !include scripts.yaml
  ui_dashboard: !include ui_dashboard.yaml
