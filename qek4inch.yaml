esphome:
  name: qek-cyd-40
  friendly_name: "QEK Dashboard 4.0"
  on_boot:
    priority: -200.0 # Wartet, bis WLAN und Home Assistant API verbunden sind
    then:
      - output.turn_on: audio_amp_enable
      - delay: 5s # Kurzer Puffer für den ersten Status-Sync aus HA
      - if:
          condition:
            binary_sensor.is_on: ha_auto_dim
          then:
            - logger.log: "Boot-Sync: Auto-Dim ist ON -> Starte Timer"
            - script.execute: dim_inactivity_timer

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_OPI: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "QEK-Display-Fallback"

api:
  encryption:
    key: !secret qek_cyd_40__encryption_key

ota:
  - platform: esphome
    encryption:

# 1. SPI-Bus für das ST7796S Display
spi:
  - id: spi_display
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

# 2. ST7796S Display
display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi_display
    model: ST7796
    dimensions:
      width: 320
      height: 480
    #rotation: 90
    cs_pin: GPIO10
    dc_pin: GPIO46
    data_rate: 40MHz
    invert_colors: true
    auto_clear_enabled: false

# 3. PWM-Generator für das Backlight auf IO45
output:
#backfacing LED
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm
    frequency: 1000Hz
#audio
  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
    id: audio_amp_enable
#display backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    pin: GPIO42
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    name: "Board Status LED"
    id: cyd_rgb_led
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms
    effects:
      - pulse:
          name: "Status Pulse"
          transition_length: 800ms
          update_interval: 1s
      - strobe:
          name: "Alarm Strobe"
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms

# 4. I2C-Bus für den Touchscreen
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

binary_sensor:
  - platform: homeassistant
    id: ha_auto_dim
    entity_id: binary_sensor.qek_qek_dashboard_4_0_cyd_auto_dim
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: ha_auto_dim
            then:
              # Auto-Dim aktiviert: 60s Countdown starten
              - script.execute: dim_inactivity_timer
            else:
              # Auto-Dim deaktiviert: Timer stoppen, Display auf 80 % und Guard weg
              - script.stop: dim_inactivity_timer
              - light.turn_on:
                  id: cyd_backlight
                  brightness: 80%
              - lvgl.widget.update:
                  id: dim_guard_overlay
                  clickable: false
                  hidden: true

touchscreen:
  - platform: ft63x6
    id: my_touch
    display: my_display
    #interrupt_pin: GPIO17
    reset_pin: GPIO18
    on_touch:
      then:
        - if:
            condition:
              binary_sensor.is_on: ha_auto_dim
            then:
              # Jeder Fingertipp im Normalbetrieb schiebt das Dimmen um 60 s nach hinten
              - script.execute: dim_inactivity_timer

# I2S audio bus configuration (verify against your board pinout if silent)
i2s_audio:
  - id: i2s_audio_bus
    i2s_mclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
    i2s_lrclk_pin: GPIO7

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: cyd_speaker
    dac_type: external
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    audio_dac: es8311_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
  
media_player:
  - platform: speaker
    name: "CYD QEK Speaker"
    id: cyd_qek_speaker
    announcement_pipeline:
      speaker: cyd_speaker
      format: FLAC

# Local chime / alert script callable from Home Assistant automations
script:
  - id: dim_inactivity_timer
    mode: restart
    then:
      - delay: 60s
      # Nach 60 s ohne Touch: Display dimmen und Guard scharf schalten
      - light.turn_on:
          id: cyd_backlight
          brightness: 5%
      - lvgl.widget.update:
          id: dim_guard_overlay
          hidden: false
          clickable: true
# ==========================================
# Zeit-Synchronisation via Home Assistant
# ==========================================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lvgl.label.update:
            id: lbl_status_datetime
            text: !lambda |-
              auto now = id(ha_time).now();
              if (!now.is_valid()) return std::string("--, -- ---  --:--");
              char buf[32];
              time_t t = now.timestamp;
              struct tm *timeinfo = localtime(&t);
              strftime(buf, sizeof(buf), "%a, %d %b  %H:%M", timeinfo);
              return std::string(buf);
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lbl_status_datetime
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("--, -- ---  --:--");
                char buf[32];
                time_t t = now.timestamp;
                struct tm *timeinfo = localtime(&t);
                strftime(buf, sizeof(buf), "%a, %d %b  %H:%M", timeinfo);
                return std::string(buf);

#GPS link?
text_sensor:
  - platform: homeassistant
    id: qek_status_gps
    entity_id: sensor.qek_status_gps
    on_value:
      then:
        - lambda: |-
            if (x == "ok") {
              // Helles Blau (#38BDF8) -> 3D Fix stabil
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            } else if (x == "warn") {
              // Gelb-Orange (#FBBF24) -> Suche / Ungünstig / 2D Fix
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              // Slate-Grau (#64748B) -> Aus / Getrennt / Nicht verfügbar
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0x64748B), LV_PART_MAIN);
            }
  # Extenal Power?
  - platform: homeassistant
    id: qek_status_pwr
    entity_id: sensor.qek_status_pwr
    on_value:
      then:
        - lambda: |-
            if (x == "disconnected") {
              // Kein Landstrom: Durchgestrichener Stecker + Grau
              lv_label_set_text(id(badge_pwr), "\uE646");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (x == "off") {
              // Landstrom vorhanden, Relais aus: Normaler Stecker + Grau
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (x == "warn") {
              // Überlast (> 8A): Normaler Stecker + Gelb-Orange
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              // Normalbetrieb (ok): Normaler Stecker + Blau
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(badge_pwr));
  #WiFi WAN quality
  - platform: homeassistant
    id: qek_status_wan
    entity_id: sensor.qek_status_wan
    on_value:
      then:
        - lambda: |-
            std::string val = x;
            for (auto &c : val) c = tolower(c);

            if (val == "none") {
              // Kein Internet / getrennt: wifi_off + Slate-Grau
              lv_label_set_text(id(badge_wan), "\uE648");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (val == "fair_warn" || val == "poor_warn") {
              // Repeater failing / instabil: 2 Balken + Gelb
              lv_label_set_text(id(badge_wan), "\uE4D9");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              // good_ok: Volles Signal + Primär-Blau
              lv_label_set_text(id(badge_wan), "\uE63E");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(badge_wan));

  # 6. Formatierte Restzeit aus Home Assistant
  - platform: homeassistant
    id: bat_time_remaining
    entity_id: sensor.qek_battery_time_remaining
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_bat_remaining
            text: !lambda "return x.c_str();"

sensor:
  # Temp&humidity sensor AM2302
  - platform: dht
    pin: GPIO21
    model: AM2302
    update_interval: 15s
    temperature:
      name: "CYD QEK Temperatur"
      id: cyd_qek_temperatur
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
      on_value:
        then:
          - lambda: |-
              lv_label_set_text_fmt(id(lbl_climate_temp), "%.1f°C", x);
              // Color coding: Red > 28°C, Warn < 12°C, Normal Blue otherwise
              if (x >= 28.0) {
                lv_obj_set_style_text_color(id(lbl_climate_temp), lv_color_hex(0xEF4444), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(icon_climate_card), lv_color_hex(0xEF4444), LV_PART_MAIN);
              } else if (x <= 12.0) {
                lv_obj_set_style_text_color(id(lbl_climate_temp), lv_color_hex(0xFBBF24), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(icon_climate_card), lv_color_hex(0xFBBF24), LV_PART_MAIN);
              } else {
                lv_obj_set_style_text_color(id(lbl_climate_temp), lv_color_hex(0x38BDF8), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(icon_climate_card), lv_color_hex(0x38BDF8), LV_PART_MAIN);
              }
              lv_obj_invalidate(id(lbl_climate_temp));
              lv_obj_invalidate(id(icon_climate_card));

    humidity:
      name: "CYD QEK Luftfeuchtigkeit"
      id: cyd_qek_luftfeuchtigkeit
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: |-
              lv_label_set_text_fmt(id(lbl_climate_hum), "Hum: %.0f%%", x);
              // Warn (Yellow) if humidity > 70% in caravan, else normal blue
              if (x >= 70.0) {
                lv_obj_set_style_text_color(id(icon_climate_hum), lv_color_hex(0xFBBF24), LV_PART_MAIN);
              } else {
                lv_obj_set_style_text_color(id(icon_climate_hum), lv_color_hex(0x38BDF8), LV_PART_MAIN);
              }
              lv_obj_invalidate(id(lbl_climate_hum));
              lv_obj_invalidate(id(icon_climate_hum));


  # 1. C1000 SoC (Rot < 20%, Gelb < 30%, sonst Blau)
  - platform: homeassistant
    id: c1000_soc
    entity_id: sensor.anker_solix_c1000_battery_percentage
    on_value:
      then:
        - lambda: |-
            int soc = (int)x;
            lv_label_set_text_fmt(id(lbl_bat_soc), "%d%%", soc);

            if (soc < 20) {
              lv_obj_set_style_text_color(id(lbl_bat_soc), lv_color_hex(0xEF4444), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_bat_card), lv_color_hex(0xEF4444), LV_PART_MAIN);
            } else if (soc < 30) {
              lv_obj_set_style_text_color(id(lbl_bat_soc), lv_color_hex(0xFBBF24), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_bat_card), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(id(lbl_bat_soc), lv_color_hex(0x38BDF8), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_bat_card), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(lbl_bat_soc));
            lv_obj_invalidate(id(icon_bat_card));

  # 2. Solar Input (W) -> Setzt Sonne-Icon wenn > 2 W
  - platform: homeassistant
    id: bat_sol_in
    entity_id: sensor.anker_solix_c1000_solar_power_in
    on_value:
      then:
        - lambda: |-
            if (x > 2.0) {
              lv_label_set_text_fmt(id(lbl_bat_in), "In: %d W", (int)x);
              lv_label_set_text(id(icon_bat_source), "\uE81A"); // Sonne
              lv_obj_set_style_text_color(id(icon_bat_source), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            } else if (isnan(id(bat_ac_in).state) || id(bat_ac_in).state <= 2.0) {
              lv_label_set_text(id(lbl_bat_in), "In: 0 W");
              lv_label_set_text(id(icon_bat_source), "\uE646"); // Inaktiv
              lv_obj_set_style_text_color(id(icon_bat_source), lv_color_hex(0x64748B), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(lbl_bat_in));
            lv_obj_invalidate(id(icon_bat_source));

  # 3. AC Input (W) -> Setzt Stecker-Icon wenn > 2 W
  - platform: homeassistant
    id: bat_ac_in
    entity_id: sensor.anker_solix_c1000_ac_power_in
    on_value:
      then:
        - lambda: |-
            if (x > 2.0) {
              lv_label_set_text_fmt(id(lbl_bat_in), "In: %d W", (int)x);
              lv_label_set_text(id(icon_bat_source), "\uE63C"); // Stecker
              lv_obj_set_style_text_color(id(icon_bat_source), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            } else if (isnan(id(bat_sol_in).state) || id(bat_sol_in).state <= 2.0) {
              lv_label_set_text(id(lbl_bat_in), "In: 0 W");
              lv_label_set_text(id(icon_bat_source), "\uE646"); // Inaktiv
              lv_obj_set_style_text_color(id(icon_bat_source), lv_color_hex(0x64748B), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(lbl_bat_in));
            lv_obj_invalidate(id(icon_bat_source));

  # 4. Entladeleistung Total Out (W) -> Immer Blau
  - platform: homeassistant
    id: bat_out
    entity_id: sensor.anker_solix_c1000_total_power_out
    on_value:
      then:
        - lambda: |-
            lv_label_set_text_fmt(id(lbl_bat_out), "Out: %d W", (int)x);
            lv_obj_invalidate(id(lbl_bat_out));

  # 5. 1h-Trend Rate (%/h) -> Steuert Ziel-Icon (Volle Batterie Blau vs. Leere Batterie Gelb)
  - platform: homeassistant
    id: c1000_soc_rate
    entity_id: sensor.qek_solix_c300ac_qek_prediction_battery
    on_value:
      then:
        - lambda: |-
            if (x > 0.3) {
              // Netto-Gewinn: Lädt bis voll -> Volle Batterie in Blau
              lv_label_set_text(id(icon_bat_target), "\uE1A4");
              lv_obj_set_style_text_color(id(icon_bat_target), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            } else if (x < -0.2) {
              // Netto-Verlust: Entlädt bis leer -> Leere Batterie in Gelb
              lv_label_set_text(id(icon_bat_target), "\uEBDC");
              lv_obj_set_style_text_color(id(icon_bat_target), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              // Standby / ausgeglichen -> Grau
              lv_label_set_text(id(icon_bat_target), "\uEBD2");
              lv_obj_set_style_text_color(id(icon_bat_target), lv_color_hex(0x64748B), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(icon_bat_target));

# 7. Berechneter Taupunkt aus Home Assistant
  - platform: homeassistant
    id: qek_dew_point
    entity_id: sensor.qek_dew_point
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              lv_label_set_text_fmt(id(lbl_climate_dew), "Dew: %.1f°C", x);
            } else {
              lv_label_set_text(id(lbl_climate_dew), "Dew: --.-°C");
            }
            lv_obj_invalidate(id(lbl_climate_dew));
                        
# 5. Typografie (Inter)
font:
  - file: "gfonts://Inter"
    id: font_bar
    size: 13
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>"
  - file: "gfonts://Inter"
    id: font_card_header
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%,>"
  - file: "gfonts://Inter"
    id: font_val_hero
    size: 28
    glyphs: "0123456789.-%°CWAV"
  - file: "gfonts://Inter"
    id: font_sub
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>"
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 18
    glyphs:
      - "\uEB3A" # satellite_alt (GPS)
      - "\uE63E" # wifi (Voll / normal)
      - "\uE4D9" # wifi_2_bar (failing / Warnung)
      - "\uE648" # wifi_off (Offline / kein Ping)
      - "\uE63C" # power (EXT PWR)
      - "\uE646" # power_off (Durchgestrichener Stecker)
      - "\uE1A4" # battery_full
      - "\uEBDC" # battery_0_bar (Indikator: Entlädt bis leer)
      - "\uE0F0" # lightbulb
      - "\uE798" # water_drop
      - "\uF076" # thermostat
      - "\uEBD2" # battery_4_bar (Header & Standby)
      - "\uE81A" # wb_sunny (Sonne für Solar-Ladung)
      - "\uF879" # dew_point (Taupunkt)

# 6. LVGL UI-Aufbau (Vollständig passiv & modular)
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  rotation: 270

  # Globale Style-Definitionen
  style_definitions:
    # Kachel-Hintergrund
    - id: style_card
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 10
      pad_all: 8

    # Status-Badge Hintergrund
    - id: style_badge
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 6
      pad_all: 4

    # Text-Styles / Farbkodierung
    - id: style_txt_normal
      text_color: 0x38BDF8 # Helles Blau (Normal)
      text_font: font_card_header

    - id: style_txt_inactive
      text_color: 0x64748B # Grau (Aus / Inaktiv)
      text_font: font_card_header

    - id: style_txt_warn
      text_color: 0xFBBF24 # Orangegelb (Warnung / Fehler)
      text_font: font_card_header

    - id: style_val_blue
      text_color: 0x38BDF8 # Helles Blau für Werte
      text_font: font_val_hero

    - id: style_val_warn
      text_color: 0xFBBF24 # Orangegelb für Werte
      text_font: font_val_hero

    - id: style_sub_gray
      text_color: 0x94A3B8 # Helles Grau für Beschriftung
      text_font: font_sub

    - id: style_val_red
      text_color: 0xEF4444 # Kräftiges Signalrot (Red 500)
      text_font: font_val_hero

    # Icon-Styles für Statusleiste
    - id: style_icon_normal
      text_color: 0x38BDF8 # Helles Blau (Fix / Aktiv)
      text_font: font_icons

    - id: style_icon_warn
      text_color: 0xFBBF24 # Orangegelb (Suche / Ungünstig)
      text_font: font_icons

    - id: style_icon_inactive
      text_color: 0x64748B # Grau (Kein Empfang / Aus)
      text_font: font_icons
  widgets:
    - obj:
        id: main_screen
        width: 480
        height: 320
        bg_color: 0x0F172A # Slate 900
        border_width: 0 # Kein Rahmen
        outline_width: 0 # Keine Outline
        radius: 0 # Ecken exakt rechtwinklig (keine weißen Punkte mehr)
        pad_all: 0
        widgets:
          # ==========================================
          # STATUSZEILE (Höhe 36px)
          # ==========================================
          - obj:
              x: 8
              y: 6
              width: 464
              height: 30
              bg_color: 0x131D31
              border_width: 1
              border_color: 0x1E293B
              radius: 6
              pad_all: 0
              widgets:
                # Datum & Uhrzeit
                - label:
                    id: lbl_status_datetime
                    text: "Wed, 11. Nov  14:55"
                    styles: style_txt_normal
                    text_font: font_bar
                    align: left_mid
                    x: 6

                # Badges rechts
                # EXT PWR Status (Platzhalter: Blau = Aktiv)
                - label:
                    id: badge_pwr
                    text: "\uE646" # power (EXT PWR) off
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: right_mid
                    x: -16

                # WAN Status (Platzhalter: Blau = Verbunden)
                - label:
                    id: badge_wan
                    text: "\uE648" # Startzustand: getrennt
                    text_font: font_icons
                    styles: style_icon_inactive # Startfarbe: Slate-Grau
                    align: right_mid
                    x: -48 # Sitzt mittig zwischen GPS (-98) und PWR (-24)

                # GPS Status (Platzhalter: Gelb = Suche/Fix)
                - label:
                    id: badge_gps
                    text: "\uEB3A" #sat
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: right_mid
                    x: -80

          # ==========================================
          # KACHEL 1: Oben Links (Externe Power)
          # ==========================================
          - obj:
              x: 8
              y: 44
              width: 228
              height: 130
              styles: style_card
              widgets:
                - label:
                    styles: style_txt_normal
                    text: "EXTERNE POWER"
                    align: top_left
                - label:
                    id: lbl_ext_pwr_status
                    styles: style_val_blue
                    text: "230 V"
                    align: center
                    y: -2
                - label:
                    id: lbl_ext_pwr_sub
                    styles: style_sub_gray
                    text: "Landstrom aktiv | 16A"
                    align: bottom_mid

          # ==========================================
          # KACHEL 2: BATTERIE (C1000)
          # ==========================================
          - obj:
              id: card_battery
              x: 244
              y: 44
              width: 228
              height: 130
              styles: style_card
              widgets:
                # Kachel-Header
                - label:
                    id: icon_bat_card
                    text: "\uEBD2"
                    text_font: font_icons
                    styles: style_icon_normal
                    align: top_left

                - label:
                    text: "BATTERY"
                    text_font: font_card_header
                    styles: style_txt_normal
                    align: top_left
                    x: 24
                    y: 2

                # --- LINKS: Großer Hero-SoC ---
                - label:
                    id: lbl_bat_soc
                    text: "--%"
                    text_font: font_val_hero
                    styles: style_val_blue
                    align: left_mid
                    x: 4
                    y: 10

                # --- RECHTS ZEILE 1: Input + Quellen-Icon ---
                - label:
                    id: lbl_bat_in
                    text: "In: -- W"
                    text_font: font_sub
                    styles: style_txt_normal
                    align: top_right
                    x: -24 # Rechtsbündig an der Text-Fluchtlinie
                    y: 34

                - label:
                    id: icon_bat_source
                    text: "\uE646" # Start: Inaktiv
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: top_right
                    x: -2 # Rechts außen in der Icon-Spalte
                    y: 31

                # --- RECHTS ZEILE 2: Output ---
                - label:
                    id: lbl_bat_out
                    text: "Out: -- W"
                    text_font: font_sub
                    styles: style_txt_normal
                    align: top_right
                    x: -24 # Exakt auf derselben vertikalen Linie wie "In:"
                    y: 58

                # --- RECHTS ZEILE 3: Restzeit + Ziel-Icon ---
                - label:
                    id: lbl_bat_remaining
                    text: "--h --m"
                    text_font: font_sub
                    styles: style_txt_normal
                    align: top_right
                    x: -24 # Ebenfalls rechtsbündig auf derselben Linie
                    y: 82

                - label:
                    id: icon_bat_target
                    text: "\uEBD2" # Start: Neutral/Standby
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: top_right
                    x: -2 # Exakt unter dem Quellen-Icon
                    y: 79
          # ==========================================
          # KACHEL 3: Unten Links (Licht & Wasser)
          # ==========================================
          - obj:
              x: 8
              y: 182
              width: 228
              height: 130
              styles: style_card
              widgets:
                - label:
                    styles: style_txt_normal
                    text: "LICHT & WASSER"
                    align: top_left
                - label:
                    id: lbl_light_water_main
                    styles: style_val_blue
                    text: "BEREIT"
                    align: center
                    y: -2
                - label:
                    id: lbl_light_water_sub
                    styles: style_sub_gray
                    text: "Licht: AN | Pumpe: STANDBY"
                    align: bottom_mid

# ==========================================
          # KACHEL 4: CLIMATE (Unten Rechts)
          # ==========================================
          - obj:
              id: card_climate
              x: 244
              y: 182
              width: 228
              height: 130
              styles: style_card
              widgets:
                # Kachel-Header (Thermostat-Icon + CLIMATE)
                - label:
                    id: icon_climate_card
                    text: "\uF076" # thermostat
                    text_font: font_icons
                    styles: style_icon_normal
                    align: top_left

                - label:
                    text: "CLIMATE"
                    text_font: font_card_header
                    styles: style_txt_normal
                    align: top_left
                    x: 24
                    y: 2

                # --- LINKS: Großer Hero-Wert Innentemperatur ---
                - label:
                    id: lbl_climate_temp
                    text: "--.-°C"
                    text_font: font_val_hero
                    styles: style_val_blue
                    align: left_mid
                    x: 4
                    y: 10

                # --- RECHTS ZEILE 1: Indoor Humidity + Tropfen-Icon ---
                - label:
                    id: lbl_climate_hum
                    text: "Hum: --%"
                    text_font: font_sub
                    styles: style_txt_normal
                    align: top_right
                    x: -24 # Exakt gleiche Text-Fluchtlinie wie Battery-Kachel
                    y: 34

                - label:
                    id: icon_climate_hum
                    text: "\uE798" # water_drop
                    text_font: font_icons
                    styles: style_icon_normal
                    align: top_right
                    x: -2 # Exakt in der rechten Icon-Spalte
                    y: 31
                    
          # ==========================================
          # DIM GUARD OVERLAY (Vollflächig 480x320)
          # ==========================================
          - obj:
              id: dim_guard_overlay
              x: 0
              y: 0
              width: 480
              height: 320
              bg_opa: TRANSP
              border_width: 0
              radius: 0
              pad_all: 0
              scrollbar_mode: "off"
              scrollable: false
              hidden: true
              clickable: false
              on_click:
                then:
                  # 1. Overlay sofort taub schalten
                  - lvgl.widget.update:
                      id: dim_guard_overlay
                      clickable: false

                  # 2. Helligkeit auf 80 % wecken
                  - light.turn_on:
                      id: cyd_backlight
                      brightness: 80%

                  # 3. 60-Sekunden-Countdown wieder von vorn starten
                  - script.execute: dim_inactivity_timer

                  # 4. Nach 500 ms Schutzzeit Overlay ausblenden
                  - delay: 500ms
                  - lvgl.widget.update:
                      id: dim_guard_overlay
                      hidden: true
