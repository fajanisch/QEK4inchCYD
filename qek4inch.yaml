esphome:
  name: qek-cyd-40
  friendly_name: "QEK Dashboard 4.0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "QEK-Display-Fallback"

api:

ota:
  - platform: esphome

# 1. SPI-Bus für das ST7796S Display
spi:
  - id: spi_display
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

# 2. ST7796S Display
display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi_display
    model: ST7796
    dimensions:
      width: 320
      height: 480
    rotation: 90
    cs_pin: GPIO10
    dc_pin: GPIO46
    data_rate: 40MHz
    auto_clear_enabled: false

# 3. Hintergrundbeleuchtung (Backlight auf IO45, aktiv HIGH)
output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON

# 4. I2C-Bus für den Touchscreen
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

# 5. Kapazitiver Touchscreen (FT6336U)
touchscreen:
  - platform: ft63x6
    id: my_touch
    display: my_display
    interrupt_pin: GPIO17
    reset_pin: GPIO18