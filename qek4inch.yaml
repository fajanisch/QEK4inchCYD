    id: display_st7701s_1
    color_order: RGB
    cs_pin: 39
    data_pins: [46, 9, 10, 11, 12, 13, 14, 0, 4, 5, 6, 7, 15, 8, 20, 3]
    data_rate: 40MHz
    de_pin: 18
    dimensions:
      height: 480
      width: 480
    hsync_pin: 16
    init_sequence: [[1], [255, 119, 1, 0, 0, 16], [192, 59, 0], [193, 13, 2], [194, 49, 5], [205, 0], [176, 0, 17, 24, 14, 17, 6, 7, 8, 7, 34, 4, 18, 15, 170, 49, 24], [177, 0, 17, 25, 14, 18, 7, 8, 8, 8, 34, 4, 17, 17, 169, 50, 24], [255, 119, 1, 0, 0, 17], [176, 96], [177, 50], [178, 7], [179, 128], [181, 73], [183, 133], [184, 33], [193, 120], [194, 120], [224, 0, 27, 2], [225, 8, 160, 0, 0, 7, 160, 0, 0, 0, 68, 68], [226, 17, 17, 68, 68, 237, 160, 0, 0, 236, 160, 0, 0], [227, 0, 0, 17, 17], [228, 68, 68], [229, 10, 233, 216, 160, 12, 235, 216, 160, 14, 237, 216, 160, 16, 239, 216, 160], [230, 0, 0, 17, 17], [231, 68, 68], [232, 9, 232, 216, 160, 11, 234, 216, 160, 13, 236, 216, 160, 15, 238, 216, 160], [235, 2, 0, 228, 228, 136, 0, 64], [236, 60, 0], [237, 171, 137, 118, 84, 2, 255, 255, 255, 255, 255, 255, 32, 69, 103, 152, 186], [255, 119, 1, 0, 0, 19], [229, 228], [58, 96]]
