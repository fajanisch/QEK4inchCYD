esphome:
  name: qek-cyd-40
  friendly_name: "QEK Dashboard 4.0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf # esp-idf wird für ESP32-S3 und PSRAM-Support dringend empfohlen

psram:
  mode: octal # oder quad, je nach Modul – meist octal beim N16R8

logger:

# I2C-Bus für den kapazitiven Touch (FT6336U)
i2c:
  sda: GPIO18
  scl: GPIO8
  scan: true
  frequency: 400kHz

# SPI-Bus für das Display
spi:
  - id: spi_display
    clk_pin: GPIO12
    mosi_pin: GPIO13
    miso_pin: GPIO11

# Korrekte Display-Plattform über mipi_spi
display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi_display
    model: ST7796
    dimensions:
      width: 320
      height: 480
    rotation: 90
    cs_pin: GPIO10
    dc_pin: GPIO4
    # reset_pin: GPIO0  # Bei Problemen auskommentiert lassen
    data_rate: 40MHz
    auto_clear_enabled: false

# Kapazitiver Touchscreen (FT6336U)
touchscreen:
  - platform: ft63x6
    id: my_touch
    display: my_display
    interrupt_pin: GPIO3 # INT Pin laut LCDWiki Tabelle
    reset_pin: GPIO2     # RST Pin laut LCDWiki Tabelle
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true

# Hintergrundbeleuchtung (Backlight)
output:
  - platform: ledc
    pin: GPIO38 # LCD-Backlight Pin laut LCDWiki
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON