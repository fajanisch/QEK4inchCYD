esphome:
  name: qek-cyd-40
  friendly_name: "QEK Dashboard 4.0"
  on_boot:
    priority: -100
    then:
#      - lvgl.widget.hide: touch_blocker

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_OPI: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "QEK-Display-Fallback"

api:
  encryption:
    key: !secret qek_cyd_40__encryption_key

ota:
  - platform: esphome
    encryption:

# 1. SPI-Bus für das ST7796S Display
spi:
  - id: spi_display
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

# 2. ST7796S Display
display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi_display
    model: ST7796
    dimensions:
      width: 320
      height: 480
    #rotation: 90
    cs_pin: GPIO10
    dc_pin: GPIO46
    data_rate: 40MHz
    invert_colors: true
    auto_clear_enabled: false

# 3. PWM-Generator für das Backlight auf IO45
output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    pin: GPIO42
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    name: "Board Status LED"
    id: cyd_rgb_led
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms
    effects:
      - pulse:
          name: "Status Pulse"
          transition_length: 800ms
          update_interval: 1s
      - strobe:
          name: "Alarm Strobe"
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms

# 4. I2C-Bus für den Touchscreen
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

binary_sensor:
  - platform: homeassistant
    id: auto_dim_flag
    entity_id: binary_sensor.qek_qek_dashboard_4_0_cyd_auto_dim
    on_state:
      then:

touchscreen:
  - platform: ft63x6
    id: my_touch
    display: my_display
    interrupt_pin: GPIO17
    reset_pin: GPIO18

# ==========================================
# Zeit-Synchronisation via Home Assistant
# ==========================================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lvgl.label.update:
            id: lbl_status_datetime
            text: !lambda |-
              auto now = id(ha_time).now();
              if (!now.is_valid()) return std::string("--, -- ---  --:--");
              char buf[32];
              time_t t = now.timestamp;
              struct tm *timeinfo = localtime(&t);
              strftime(buf, sizeof(buf), "%a, %d %b  %H:%M", timeinfo);
              return std::string(buf);
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lbl_status_datetime
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("--, -- ---  --:--");
                char buf[32];
                time_t t = now.timestamp;
                struct tm *timeinfo = localtime(&t);
                strftime(buf, sizeof(buf), "%a, %d %b  %H:%M", timeinfo);
                return std::string(buf);

#GPS link?
text_sensor:
  - platform: homeassistant
    id: qek_status_gps
    entity_id: sensor.qek_status_gps
    on_value:
      then:
        - lambda: |-
            if (x == "ok") {
              // Helles Blau (#38BDF8) -> 3D Fix stabil
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            } else if (x == "warn") {
              // Gelb-Orange (#FBBF24) -> Suche / Ungünstig / 2D Fix
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              // Slate-Grau (#64748B) -> Aus / Getrennt / Nicht verfügbar
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0x64748B), LV_PART_MAIN);
            }
  # Extenal Power?
  - platform: homeassistant
    id: qek_status_pwr
    entity_id: sensor.qek_status_pwr
    on_value:
      then:
        - lambda: |-
            if (x == "disconnected") {
              // Kein Landstrom: Durchgestrichener Stecker + Grau
              lv_label_set_text(id(badge_pwr), "\uE646");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (x == "off") {
              // Landstrom vorhanden, Relais aus: Normaler Stecker + Grau
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (x == "warn") {
              // Überlast (> 8A): Normaler Stecker + Gelb-Orange
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              // Normalbetrieb (ok): Normaler Stecker + Blau
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(badge_pwr));    
#WiFi WAN quality
  - platform: homeassistant
    id: qek_status_wan
    entity_id: sensor.qek_status_wan
    on_value:
      then:
        - lambda: |-
            std::string val = x;
            for (auto &c : val) c = tolower(c);

            if (val == "none") {
              // Kein Internet / getrennt: wifi_off + Slate-Grau
              lv_label_set_text(id(badge_wan), "\uE648");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (val == "fair_warn" || val == "poor_warn") {
              // Repeater failing / instabil: 2 Balken + Gelb
              lv_label_set_text(id(badge_wan), "\uE4D9");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              // good_ok: Volles Signal + Primär-Blau
              lv_label_set_text(id(badge_wan), "\uE63E");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(badge_wan));
            
# 5. Typografie (Inter)
font:
  - file: "gfonts://Inter"
    id: font_bar
    size: 13
    glyphs: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,'
  - file: "gfonts://Inter"
    id: font_card_header
    size: 12
    glyphs: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%,'
  - file: "gfonts://Inter"
    id: font_val_hero
    size: 28
    glyphs: '0123456789.-%°CWAV'
  - file: "gfonts://Inter"
    id: font_sub
    size: 12
    glyphs: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|'
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 18
    glyphs:
      - "\uEB3A" # satellite_alt (GPS)
      - "\uE63E" # wifi (Voll / normal)
      - "\uE4D9" # wifi_2_bar (failing / Warnung)
      - "\uE648" # wifi_off (Offline / kein Ping)
      - "\uE63C" # power (EXT PWR)
      - "\uE646" # power_off (Durchgestrichener Stecker)
      - "\uE1A4" # battery_full
      - "\uE0F0" # lightbulb
      - "\uE798" # water_drop
      - "\uF076" # thermostat

# 6. LVGL UI-Aufbau (Vollständig passiv & modular)
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  rotation: 90

  # Globale Style-Definitionen
  style_definitions:
    # Kachel-Hintergrund
    - id: style_card
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 10
      pad_all: 8

    # Status-Badge Hintergrund
    - id: style_badge
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 6
      pad_all: 4

    # Text-Styles / Farbkodierung
    - id: style_txt_normal
      text_color: 0x38BDF8       # Helles Blau (Normal)
      text_font: font_card_header

    - id: style_txt_inactive
      text_color: 0x64748B       # Grau (Aus / Inaktiv)
      text_font: font_card_header

    - id: style_txt_warn
      text_color: 0xFBBF24       # Orangegelb (Warnung / Fehler)
      text_font: font_card_header

    - id: style_val_blue
      text_color: 0x38BDF8       # Helles Blau für Werte
      text_font: font_val_hero

    - id: style_val_warn
      text_color: 0xFBBF24       # Orangegelb für Werte
      text_font: font_val_hero

    - id: style_sub_gray
      text_color: 0x94A3B8       # Helles Grau für Beschriftung
      text_font: font_sub
      
# Icon-Styles für Statusleiste
    - id: style_icon_normal
      text_color: 0x38BDF8       # Helles Blau (Fix / Aktiv)
      text_font: font_icons

    - id: style_icon_warn
      text_color: 0xFBBF24       # Orangegelb (Suche / Ungünstig)
      text_font: font_icons

    - id: style_icon_inactive
      text_color: 0x64748B       # Grau (Kein Empfang / Aus)
      text_font: font_icons
  widgets:
    - obj:
        id: main_screen
        width: 480
        height: 320
        bg_color: 0x0F172A        # Slate 900
        border_width: 0           # Kein Rahmen
        outline_width: 0          # Keine Outline
        radius: 0                 # Ecken exakt rechtwinklig (keine weißen Punkte mehr)pad_all: 0
        pad_all: 0
        widgets:

          # ==========================================
          # STATUSZEILE (Höhe 36px)
          # ==========================================
          - obj:
              x: 8
              y: 6
              width: 464
              height: 30
              bg_color: 0x131D31
              border_width: 1
              border_color: 0x1E293B
              radius: 6
              pad_all: 0
              widgets:
                # Datum & Uhrzeit
                - label:
                    id: lbl_status_datetime
                    text: "Wed, 11. Nov  14:55"
                    text_color: 0xE2E8F0
                    text_font: font_bar
                    align: left_mid
                    x: 6

                # Badges rechts
                # EXT PWR Status (Platzhalter: Blau = Aktiv)
                - label:
                    id: badge_pwr
                    text: "\uE646" # power (EXT PWR) off
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: right_mid
                    x: -16

                # WAN Status (Platzhalter: Blau = Verbunden)
                - label:
                    id: badge_wan
                    text: "\uE648"               # Startzustand: getrennt
                    text_font: font_icons
                    styles: style_icon_inactive   # Startfarbe: Slate-Grau
                    align: right_mid
                    x: -40                        # Sitzt mittig zwischen GPS (-98) und PWR (-24)

                # GPS Status (Platzhalter: Gelb = Suche/Fix)
                - label:
                    id: badge_gps
                    text: "\uEB3A" #sat
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: right_mid
                    x: -64

          # ==========================================
          # KACHEL 1: Oben Links (Externe Power)
          # ==========================================
          - obj:
              x: 8
              y: 44
              width: 228
              height: 130
              styles: style_card
              widgets:
                - label:
                    styles: style_txt_normal
                    text: "EXTERNE POWER"
                    align: top_left
                - label:
                    id: lbl_ext_pwr_status
                    styles: style_val_blue
                    text: "230 V"
                    align: center
                    y: -2
                - label:
                    id: lbl_ext_pwr_sub
                    styles: style_sub_gray
                    text: "Landstrom aktiv | 16A"
                    align: bottom_mid

          # ==========================================
          # KACHEL 2: Oben Rechts (Batterie C1000)
          # ==========================================
          - obj:
              x: 244
              y: 44
              width: 228
              height: 130
              styles: style_card
              widgets:
                - label:
                    styles: style_txt_normal
                    text: "BATTERIE (C1000)"
                    align: top_left
                - label:
                    id: lbl_bat_soc
                    styles: style_val_blue
                    text: "85%"
                    align: center
                    y: -2
                - label:
                    id: lbl_bat_sub
                    styles: style_sub_gray
                    text: "In: 180W | Out: 45W"
                    align: bottom_mid

          # ==========================================
          # KACHEL 3: Unten Links (Licht & Wasser)
          # ==========================================
          - obj:
              x: 8
              y: 182
              width: 228
              height: 130
              styles: style_card
              widgets:
                - label:
                    styles: style_txt_normal
                    text: "LICHT & WASSER"
                    align: top_left
                - label:
                    id: lbl_light_water_main
                    styles: style_val_blue
                    text: "BEREIT"
                    align: center
                    y: -2
                - label:
                    id: lbl_light_water_sub
                    styles: style_sub_gray
                    text: "Licht: AN | Pumpe: STANDBY"
                    align: bottom_mid

          # ==========================================
          # KACHEL 4: Unten Rechts (Klima)
          # ==========================================
          - obj:
              x: 244
              y: 182
              width: 228
              height: 130
              styles: style_card
              widgets:
                - label:
                    styles: style_txt_normal
                    text: "KLIMA"
                    align: top_left
                - label:
                    id: lbl_climate_temp
                    styles: style_val_blue
                    text: "21.4°C"
                    align: center
                    y: -2
                - label:
                    id: lbl_climate_sub
                    styles: style_sub_gray
                    text: "52% rH | Taupunkt: 11.2°C"
                    align: bottom_mid

