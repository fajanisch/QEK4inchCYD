esphome:
  name: qek-cyd-40
  friendly_name: "QEK Dashboard 4.0"
  on_boot:
    priority: -100
    then:
      - lvgl.widget.hide: touch_blocker

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_OPI: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "QEK-Display-Fallback"

api:
  encryption:
    key: !secret qek_cyd_40__encryption_key

ota:
  - platform: esphome
    encryption:

# 1. SPI-Bus für das ST7796S Display
spi:
  - id: spi_display
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

# 2. ST7796S Display (Native Auflösung, keine verbotenen Keys)
display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi_display
    model: ST7796
    dimensions:
      width: 320
      height: 480
    cs_pin: GPIO10
    dc_pin: GPIO46
    data_rate: 40MHz
    invert_colors: true
    auto_clear_enabled: false

# 3. PWM-Generator für das Backlight auf IO45
output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    pin: GPIO42
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    name: "Board Status LED"
    id: cyd_rgb_led
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms
    effects:
      - pulse:
          name: "Status Pulse"
          transition_length: 800ms
          update_interval: 1s
      - strobe:
          name: "Alarm Strobe"
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms

# 4. I2C-Bus für den Touchscreen
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

# 5. Touchscreen-Treiber & Home Assistant Trigger
touchscreen:
  - platform: ft63x6
    id: my_touch
    display: my_display
    interrupt_pin: GPIO17
    reset_pin: GPIO18
    on_touch:
      then:
        - script.execute: handle_activity

binary_sensor:
  - platform: homeassistant
    id: auto_dim_flag
    entity_id: binary_sensor.qek_qek_dashboard_4_0_cyd_auto_dim
    on_state:
      then:
        - script.execute: handle_activity

script:
  - id: handle_activity
    mode: restart
    then:
      - delay: 300ms
      - lvgl.widget.hide: touch_blocker
      - light.turn_on:
          id: cyd_backlight
          brightness: 80%
          transition_length: 150ms
      - if:
          condition:
            binary_sensor.is_on: auto_dim_flag
          then:
            - delay: 60s
            - lvgl.widget.show: touch_blocker
            - light.turn_on:
                id: cyd_backlight
                brightness: 5%
                transition_length: 1.5s

switch:
  - platform: homeassistant
    id: sonoff_switch
    entity_id: switch.matter_over_wifi_smart_switch

# 6. Typografie
font:
  - file: "gfonts://Inter"
    id: font_title
    size: 13
    glyphs: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%'
  - file: "gfonts://Inter"
    id: font_val_large
    size: 32
    glyphs: '0123456789.-%°CW'
  - file: "gfonts://Inter"
    id: font_sub
    size: 12
    glyphs: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 :.-'

# 7. LVGL Display & Touch Bindung (Reine String-Listen)
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch

  style_definitions:
    - id: style_card
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 12
      pad_all: 10

    - id: style_label_muted
      text_color: 0x94A3B8
      text_font: font_title

    - id: style_value_hero
      text_color: 0xF8FAFC
      text_font: font_val_large

    - id: style_subtext
      text_color: 0x64748B
      text_font: font_sub

  widgets:
    - obj:
        id: main_screen
        width: 480
        height: 320
        bg_color: 0x0F172A
        pad_all: 0
        widgets:

          # ==========================================
          # KACHEL 1: Oben Links (Anker C1000)
          # ==========================================
          - obj:
              x: 8
              y: 8
              width: 228
              height: 148
              styles: style_card
              widgets:
                - label:
                    styles: style_label_muted
                    text: "ANKER C1000"
                    align: top_left
                - label:
                    id: lbl_c1000_soc
                    styles: style_value_hero
                    text: "85%"
                    align: center
                    y: -4
                - label:
                    id: lbl_c1000_flow
                    styles: style_subtext
                    text: "In: 180W | Out: 45W"
                    align: bottom_mid

          # ==========================================
          # KACHEL 2: Oben Rechts (Beleuchtung)
          # ==========================================
          - obj:
              x: 244
              y: 8
              width: 228
              height: 148
              styles: style_card
              widgets:
                - label:
                    styles: style_label_muted
                    text: "BELEUCHTUNG"
                    align: top_left
                - button:
                    width: 190
                    height: 58
                    align: center
                    y: 10
                    bg_color: 0x334155
                    radius: 8
                    widgets:
                      - label:
                          id: lbl_light_state
                          text_color: 0xFBBF24
                          text_font: font_title
                          text: "Licht: AN"
                          align: center
                    on_click:
                      - homeassistant.service:
                          service: light.toggle
                          data:
                            entity_id: light.qek_innenbeleuchtung

          # ==========================================
          # KACHEL 3: Unten Links (Wasser & Pumpe)
          # ==========================================
          - obj:
              x: 8
              y: 164
              width: 228
              height: 148
              styles: style_card
              widgets:
                - label:
                    styles: style_label_muted
                    text: "WASSERVERSORGUNG"
                    align: top_left
                - button:
                    width: 190
                    height: 58
                    align: center
                    y: 10
                    bg_color: 0x0369A1
                    radius: 8
                    widgets:
                      - label:
                          id: lbl_pump_state
                          text_color: 0xFFFFFF
                          text_font: font_title
                          text: "Pumpe: BEREIT"
                          align: center
                    on_click:
                      - homeassistant.service:
                          service: switch.toggle
                          data:
                            entity_id: switch.qek_wasserpumpe

          # ==========================================
          # KACHEL 4: Unten Rechts (QEK Klima)
          # ==========================================
          - obj:
              x: 244
              y: 164
              width: 228
              height: 148
              styles: style_card
              widgets:
                - label:
                    styles: style_label_muted
                    text: "QEK KLIMA"
                    align: top_left
                - label:
                    id: lbl_qek_temp
                    styles: style_value_hero
                    text: "21.4°C"
                    align: center
                    y: -4
                - label:
                    id: lbl_qek_hum
                    styles: style_subtext
                    text: "Luftfeuchte: 52% rH"
                    align: bottom_mid

          # ==========================================
          # Transparenter Touch-Blocker für Dimmer
          # ==========================================
          - obj:
              id: touch_blocker
              x: 0
              y: 0
              width: 480
              height: 320
              bg_opa: transp
              border_width: 0
              pad_all: 0
              clickable: true
              on_click:
                - script.execute: handle_activity