    id: backlight
    pin: 38

sensor:
  - platform: wifi_signal
    name: touchdisplay1 WiFi Signal
    id: sensor_wifi
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: touchdisplay1 Uptime
    id: uptime_sensor
    entity_category: diagnostic
    update_interval: 15s

switch:
