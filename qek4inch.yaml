esphome:
  name: qek-cyd-40
  friendly_name: "QEK Dashboard 4.0"
  on_boot:
    priority: -100
    then:
      - lvgl.widget.hide: touch_blocker
        
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # 16MB Flash mit Octal-Mode (OPI)
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_OPI: "y"
      # 8MB Octal PSRAM (OPI) aktivieren
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      # Ermöglicht LVGL und Treibern transparente Speicherallokation im PSRAM
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "QEK-Display-Fallback"

api:
  encryption:
    key: !secret qek_cyd_40__encryption_key

ota:
  - platform: esphome
    encryption:

# 1. SPI-Bus für das ST7796S Display
spi:
  - id: spi_display
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

# 2. ST7796S Display
display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi_display
    model: ST7796
    dimensions:
      width: 320
      height: 480
    #rotation: 90
    cs_pin: GPIO10
    dc_pin: GPIO46
    data_rate: 40MHz
    invert_colors: true
    auto_clear_enabled: false

# 3. PWM-Generator für das Backlight auf IO45
output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm
    frequency: 1000Hz

light:
  # Stufenlos dimmbares Backlight
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  # Stufenlos dimmbare & farblich regelbare RGB-LED auf IO42
  - platform: esp32_rmt_led_strip
    pin: GPIO42
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    name: "Board Status LED"
    id: cyd_rgb_led
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms
    effects:
      - pulse:
          name: "Status Pulse"
          transition_length: 800ms
          update_interval: 1s
      - strobe:
          name: "Alarm Strobe"
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms

# 4. I2C-Bus für den Touchscreen
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

# 3. Import des Home Assistant Sensors
binary_sensor:
  - platform: homeassistant
    id: auto_dim_flag
    entity_id: binary_sensor.qek_qek_dashboard_4_0_cyd_auto_dim
    on_state:
      then:
        - script.execute: handle_activity

# 4. Touchscreen-Trigger
touchscreen:
  - platform: ft63x6
    id: my_touch
    display: my_display
    interrupt_pin: GPIO17
    reset_pin: GPIO18
    on_touch:
      then:
        - script.execute: handle_activity
          
# 5. Lokales Timer- & Dimm-Skript
script:
  - id: handle_activity
    mode: restart
    then:
      # 1. Overlay sofort verstecken, damit folgende Klicks die Buttons treffen
      - lvgl.widget.hide: touch_blocker

      # 2. Backlight aufwachen lassen
      - light.turn_on:
          id: cyd_backlight
          brightness: 80%
          transition_length: 150ms

      # 3. Dimm-Bedingung prüfen
      - if:
          condition:
            binary_sensor.is_on: auto_dim_flag
          then:
            - delay: 60s
            # Vor dem eigentlichen Abdimmen die Sperre wieder einblenden
            - lvgl.widget.show: touch_blocker
            # Sanft herunterfaden
            - light.turn_on:
                id: cyd_backlight
                brightness: 5%
                transition_length: 1.5s      
                
# 6. LVGL-Konfiguration mit Querformat-Drehung
lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touch
  rotation: 90
  buffer_size: 100%
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        - button:
            align: CENTER
            width: 240
            height: 70
            widgets:
              - label:
                  align: CENTER
                  text: "Drück mich"
                  text_color: 0xFFFFFF
            on_click:
              - logger.log: "Klick registriert!"
              - light.toggle: cyd_rgb_led
# Transparenter Klickblocker ganz am Ende der widgets-Liste:
        - obj:
            id: touch_blocker
            width: 100%
            height: 100%
            align: TOP_LEFT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: true
            on_click:
              - script.execute: handle_activity