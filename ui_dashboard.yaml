                    y: 91
                    width: 228
                    height: 85
                    styles: style_card
                    clickable: true
                    widgets:
                      - label:
                          text: "Cooker"
                          text_font: font_card_header
                          styles: style_txt_normal
                          align: top_left
                          x: 12
                          y: 10
                      - label:
                          id: lbl_sub_cooker_telemetry
                          text: "0 W • 0 Wh"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: bottom_left
                          x: 12
                          y: -10
                      - label:
                          id: icon_sub_cooker_state
                          text: "\uE197"
                          text_font: font_icons_hero
                          text_color: 0x64748B
                          align: right_mid
                          x: -12
                    on_click:
                      - homeassistant.service:
                          service: switch.toggle
                          data:
                            entity_id: switch.qek_shelly_cooker
                      - script.execute: power_detail_timeout

                - obj:
                    id: btn_sub_climate
                    x: 244
                    y: 91
                    width: 228
                    height: 85
                    styles: style_card
                    clickable: true
                    widgets:
                      - label:
                          text: "Climate"
                          text_font: font_card_header
                          styles: style_txt_normal
                          align: top_left
