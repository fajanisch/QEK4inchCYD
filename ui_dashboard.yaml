                # --- Button 1 (Oben Links): Licht & Kühlschrank ---
                - button:
                    id: btn_light_1
                    width: 108
                    height: 59
                    align: top_left
                    x: 4
                    y: 4
                    styles: style_card
                    shadow_width: 0
                    border_width: 0
                    on_click:
                      then:
                        - lambda: |-
                            static bool state_1 = false;
                            state_1 = !state_1;
                            if (state_1) {
                              lv_obj_set_style_border_color(id(btn_light_1), lv_color_hex(0xFBBF24), LV_PART_MAIN);
                              lv_obj_set_style_border_width(id(btn_light_1), 2, LV_PART_MAIN);
                              lv_obj_set_style_text_color(id(lbl_light_1a), lv_color_hex(0xFBBF24), LV_PART_MAIN);
                              lv_obj_set_style_text_color(id(lbl_light_1b), lv_color_hex(0xFBBF24), LV_PART_MAIN);
