          - obj:
              id: dim_guard_overlay
              x: 0
              y: 0
              width: 480
              height: 320
              bg_opa: TRANSP
              border_width: 0
              radius: 0
              pad_all: 0
              scrollbar_mode: "off"
              scrollable: false
              hidden: true
              clickable: false
              on_click:
                then:
                  - lvgl.widget.update:
                      id: dim_guard_overlay
                      clickable: false
                  - light.turn_on:
                      id: cyd_backlight
                      brightness: 80%
                  - script.execute: dim_inactivity_timer
                  - delay: 500ms
                  - lvgl.widget.update:
                      id: dim_guard_overlay
                      hidden: true

          - obj:
              id: screen_power_detail
              x: 0
              y: 44
              width: 480
              height: 268
              hidden: true
              bg_color: 0x0F172A
              border_width: 0
              radius: 0
              pad_all: 0
              widgets:
                # ==========================================
                # REIHE 1 LINKS: Battery (Prototyp-Layout)
                # ==========================================
                - obj:
                    id: btn_sub_bat
                    x: 8
                    y: 0
                    width: 228
                    height: 85
                    styles: style_card
                    clickable: true
                    widgets:
                      # 1. Links: Gleiches Icon wie Hauptschirm, aber groß (26px)
                      - label:
                          id: icon_sub_bat_loc
                          text: "\uE1A4" # battery_full
                          text_font: font_icons_sub
                          text_color: 0x64748B
                          align: left_mid
                          x: 2

                      # 2. Daneben: Name
                      - label:
                          id: lbl_sub_bat_name
                          text: "Battery"
                          text_font: font_card_header
                          styles: style_txt_normal
                          align: left_mid
                          x: 34

                      # 3a. Oben: Aktuelle Power (W)
                      - label:
                          id: lbl_sub_bat_pwr
                          text: "0 W"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: top_right
                          x: -34
                          y: 12

                      # 3b. Unten: Energie heute bisher (Wh)
                      - label:
                          id: lbl_sub_bat_energy
                          text: "0 Wh"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: bottom_right
                          x: -34
                          y: -12

                      # 4. Rechts: Zustands-Icon in derselben Größe (26px)
                      - label:
                          id: icon_sub_bat_state
                          text: "\uE646" # Start: Unavailable / Off
                          text_font: font_icons_sub
                          text_color: 0x64748B
                          align: right_mid
                          x: -2

                    on_click:
                      - homeassistant.service:
                          service: switch.toggle
                          data:
                            entity_id: switch.qek_shelly_c1000_ac_charger
                      - script.execute: power_detail_timeout
                      
                - obj:
                    id: btn_sub_kitchen
                    x: 244
                    y: 0
                    width: 228
                    height: 85
                    styles: style_card
                    clickable: true
                    widgets:
                      - label:
                          text: "Kitchen"
                          text_font: font_card_header
                          styles: style_txt_normal
                          align: top_left
                          x: 12
                          y: 10
                      - label:
                          id: lbl_sub_kitchen_telemetry
                          text: "0 W • 0 Wh"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: bottom_left
                          x: 12
                          y: -10
                      - label:
                          id: icon_sub_kitchen_state
                          text: "\uE197"
                          text_font: font_icons_hero
                          text_color: 0x64748B
                          align: right_mid
                          x: -12
                    on_click:
                      - homeassistant.service:
                          service: switch.toggle
                          data:
                            entity_id: switch.qek_shelly_kitchen
