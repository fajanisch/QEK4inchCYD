                    text: "\uE63C"
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: top_left
                - label:
                    text: "POWER"
                    text_font: font_card_header
                    styles: style_txt_normal
                    align: top_left
                    x: 24
                    y: 2
                - label:
                    id: icon_ext_pwr_hero
                    text: "\uE646"
                    text_font: font_icons_hero
                    text_color: 0x64748B
                    align: left_mid
                    x: 16
                    y: 10
                - label:
                    id: lbl_ext_pwr_watt
                    text: "0 W"
                    text_font: font_val_hero
                    styles: style_val_blue
                    align: left_mid
                    x: 4
                    y: 10
                    hidden: true
                - label:
                    id: lbl_ext_bat
                    text: "0 W"
                    text_font: font_sub
                    styles: style_val_blue
                    align: top_right
                    x: -26
                    y: 11
                - label:
                    id: icon_ext_bat
                    text: "\uE1A4"
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: top_right
                    x: -2
                    y: 8
                - label:
                    id: lbl_ext_kitchen
                    text: "0 W"
                    text_font: font_sub
                    styles: style_val_blue
                    align: top_right
                    x: -26
                    y: 29
                - label:
                    id: icon_ext_kitchen
                    text: "\uE56C"
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: top_right
                    x: -2
                    y: 26
                - label:
                    id: lbl_ext_cooker
                    text: "0 W"
                    text_font: font_sub
                    styles: style_val_blue
                    align: top_right
                    x: -26
                    y: 47
                - label:
                    id: icon_ext_cooker
                    text: "\uF543"
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: top_right
                    x: -2
                    y: 44
                - label:
                    id: lbl_ext_climate
