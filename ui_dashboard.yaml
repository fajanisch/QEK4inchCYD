                          id: lbl_climate_temp_val
                          text: "In: --.-°C | --% | --.-°C"
                          text_font: font_sub
                          text_color: 0xE2E8F0
                          align: top_left
                          x: 2
                          y: 36

                      # --- Section: OUTDOOR / WEATHER ---
                      # Row 1: Outdoor Temp & Humidity
                      - label:
                          text: "Temp:"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: top_left
                          x: 2
                          y: 72
                      - label:
                          id: lbl_ext_temp_val
                          text: "--.-°C"
                          text_font: font_sub
                          text_color: 0xE2E8F0
                          align: top_left
                          x: 48
                          y: 72

                      - label:
                          text: "Hum:"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: top_left
                          x: 112
                          y: 72
                      - label:
                          id: lbl_ext_hum_val
                          text: "--%"
                          text_font: font_sub
                          text_color: 0xE2E8F0
                          align: top_left
                          x: 152
                          y: 72

                      # Row 2: Pressure & Wind
                      - label:
                          text: "Press:"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: top_left
                          x: 2
                          y: 104
                      - label:
                          id: lbl_ext_press_val
                          text: "----"
                          text_font: font_sub
                          text_color: 0xE2E8F0
                          align: top_left
                          x: 48
                          y: 104

                      - label:
                          text: "Wind:"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: top_left
                          x: 112
                          y: 104
                      - label:
                          id: lbl_ext_wind_val
                          text: "--"
                          text_font: font_sub
                          text_color: 0xE2E8F0
                          align: top_left
                          x: 152
                          y: 104

                      # Row 3: Remaining Sun Hours (Off-Grid Planning)
                      - label:
                          text: "Sun (Rem):"
                          text_font: font_sub
                          text_color: 0x64748B
                          align: top_left
                          x: 2
                          y: 136
                      - label:
                          id: lbl_ext_sun_val
                          text: "--.- h"
                          text_font: font_sub
                          text_color: 0xFBBF24
                          align: top_left
                          x: 90
                          y: 136

                      # Weather Summary at the bottom of the left card
                      - label:
                          id: lbl_climate_wx_summary
