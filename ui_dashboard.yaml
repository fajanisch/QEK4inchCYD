font:
  - file: "gfonts://Inter"
    id: font_bar
    size: 13
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()+"
  - file: "gfonts://Inter"
    id: font_card_header
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%,>()+"
  - file: "gfonts://Inter"
    id: font_val_hero
    size: 28
    glyphs: "0123456789.-%°CWAV"
  - file: "gfonts://Inter"
    id: font_sub
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()+"
  - file:
      type: gfonts
      family: Inter
      weight: 600
    id: font_sub_title
    size: 16
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()<+"

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 18
    glyphs:
      - "\uEB3A"
      - "\uE63E"
      - "\uE4D9"
      - "\uE648"
      - "\uE63C"
      - "\uE646"
      - "\uE1A4"
      - "\uEBDC"
      - "\uE0F0"
      - "\uE798"
      - "\uF076"
      - "\uEBD2"
      - "\uE81A"
      - "\uF172"
      - "\uE2BD"
      - "\uF176"
      - "\uEB3B"
      - "\uEBDB"
      - "\uE51C"
      - "\uEFD8"
      - "\uF879"
      - "\uE518"
      - "\uE166"
      - "\uE56C"
      - "\uF543"
      - "\uF1D4"

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons_sub
    size: 26
    glyphs:
      # --- Geräte- / Location-Icons (links) ---
      - "\uE1A4" # battery_full (Battery)
      - "\uE56C" # kitchen (Kitchen)
      - "\uF543" # skillet (Cooker)
      - "\uF076" # thermostat (Climate)
      - "\uE63C" # power (Sonoff Main)
      # --- Zustands-Icons (rechts) ---
      - "\uE646" # power_off (1: Unavailable)
      - "\uE897" # lock (2: Locked)
      - "\uE8AC" # power_settings_new (3 & 4: Off / On)
      - "\uF8D8" # toggle_off (Alternative)
      - "\uF8D9" # toggle_on (Alternative)
      - "\uE166" # undo (Der geschwungene Rücksprung-Pfeil)

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons_hero
    size: 36
    glyphs:
      - "\uE646"

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  rotation: 270

  style_definitions:
    - id: style_card
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 10
      pad_all: 8

    - id: style_badge
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 6
      pad_all: 4

    - id: style_txt_normal
      text_color: 0x38BDF8
      text_font: font_card_header

    - id: style_txt_inactive
      text_color: 0x64748B
      text_font: font_card_header

    - id: style_txt_warn
      text_color: 0xFBBF24
      text_font: font_card_header

    - id: style_val_blue
      text_color: 0x38BDF8
      text_font: font_val_hero

    - id: style_val_warn
      text_color: 0xFBBF24
      text_font: font_val_hero

    - id: style_sub_gray
      text_color: 0x94A3B8
      text_font: font_sub

    - id: style_val_red
      text_color: 0xEF4444
      text_font: font_val_hero

    - id: style_icon_normal
      text_color: 0x38BDF8
      text_font: font_icons

    - id: style_icon_warn
      text_color: 0xFBBF24
      text_font: font_icons

    - id: style_icon_inactive
