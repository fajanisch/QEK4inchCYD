font:
  - file: "gfonts://Inter"
    id: font_bar
    size: 13
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()"
  - file: "gfonts://Inter"
    id: font_card_header
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%,>()"
  - file: "gfonts://Inter"
    id: font_val_hero
    size: 28
    glyphs: "0123456789.-%°CWAV"
  - file: "gfonts://Inter"
    id: font_sub
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()"
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 18
    glyphs:
      - "\uEB3A"
      - "\uE63E"
      - "\uE4D9"
      - "\uE648"
      - "\uE63C"
      - "\uE646"
      - "\uE1A4"
      - "\uEBDC"
      - "\uE0F0"
      - "\uE798"
      - "\uF076"
      - "\uEBD2"
      - "\uE81A"
      - "\uF172"
      - "\uE2BD"
      - "\uF176"
      - "\uEB3B"
      - "\uEBDB"
      - "\uE51C"
      - "\uEFD8"
      - "\uF879"
      - "\uE518"
      - "\uE166"
      - "\uE56C"
      - "\uF543"
      - "\uF1D4"

- file: "gfonts://Material+Symbols+Outlined"
    id: font_icons_sub
    size: 26
    glyphs:
      # --- Geräte- / Location-Icons (analog Hauptbildschirm) ---
      - "\uE1A4" # battery_full (Battery)
      - "\uE56C" # kitchen (Kitchen)
      - "\uF543" # skillet (Cooker)
      - "\uF076" # thermostat (Climate)
      - "\uE63C" # power (Sonoff Main)
      # --- 4 Zustands-Icons (rechts) ---
      - "\uE646" # power_off (1: Unavailable)
      - "\uE897" # lock (2: Locked)
      - "\uE197" # power_settings_new / Off (oder \uF8D8 toggle_off)
      - "\uF8D9" # toggle_on (4: On)

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons_hero
    size: 36
    glyphs:
      - "\uE646"

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  rotation: 270

  style_definitions:
    - id: style_card
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 10
      pad_all: 8

    - id: style_badge
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 6
      pad_all: 4

    - id: style_txt_normal
      text_color: 0x38BDF8
      text_font: font_card_header

    - id: style_txt_inactive
      text_color: 0x64748B
      text_font: font_card_header

    - id: style_txt_warn
      text_color: 0xFBBF24
      text_font: font_card_header

    - id: style_val_blue
      text_color: 0x38BDF8
      text_font: font_val_hero

    - id: style_val_warn
      text_color: 0xFBBF24
      text_font: font_val_hero

    - id: style_sub_gray
      text_color: 0x94A3B8
      text_font: font_sub

    - id: style_val_red
      text_color: 0xEF4444
      text_font: font_val_hero

    - id: style_icon_normal
      text_color: 0x38BDF8
      text_font: font_icons

    - id: style_icon_warn
      text_color: 0xFBBF24
      text_font: font_icons

    - id: style_icon_inactive
      text_color: 0x64748B
      text_font: font_icons

  widgets:
    - obj:
        id: main_screen
        width: 480
        height: 320
        bg_color: 0x0F172A
        border_width: 0
        outline_width: 0
        radius: 0
        pad_all: 0
        widgets:
          - obj:
              x: 8
              y: 6
              width: 464
              height: 30
              bg_color: 0x131D31
              border_width: 1
              border_color: 0x1E293B
              radius: 6
              pad_all: 0
              widgets:
                - label:
                    id: lbl_status_datetime
                    text: "Wed, 11. Nov  14:55"
                    styles: style_txt_normal
                    text_font: font_bar
                    align: left_mid
                    x: 6
                - label:
                    id: badge_pwr
                    text: "\uE646"
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: right_mid
                    x: -16
                - label:
                    id: badge_wan
                    text: "\uE648"
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: right_mid
                    x: -48
                - label:
                    id: badge_gps
                    text: "\uEB3A"
                    text_font: font_icons
                    styles: style_icon_inactive
                    align: right_mid
                    x: -80

          - obj:
              id: card_ext_pwr
              x: 8
              y: 44
              width: 228
              height: 130
              styles: style_card
              clickable: true
              on_click:
                - lvgl.widget.update:
                    id: screen_power_detail
                    hidden: false
                - script.execute: power_detail_timeout
              widgets:
