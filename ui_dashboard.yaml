                          text_color: 0x64748B
                          align: bottom_left
                          x: 12
                          y: -10
                      - label:
                          id: icon_sub_climate_state
                          text: "\uE197"
                          text_font: font_icons_hero
                          text_color: 0x64748B
                          align: right_mid
                          x: -12
                    on_click:
                      - homeassistant.service:
                          service: switch.toggle
                          data:
                            entity_id: switch.qek_shelly_climate_co
                      - script.execute: power_detail_timeout

                - obj:
                    id: btn_sub_sonoff
                    x: 8
                    y: 182
                    width: 228
                    height: 85
                    styles: style_card
                    clickable: true
                    widgets:
                      - label:
