                    styles: style_icon_inactive
                    align: top_right
                    x: -2
                    y: 62
                - label:
                    id: lbl_ext_rest
                    text: "0 W"
                    text_font: font_sub
                    styles: style_val_blue
                    align: top_right
                    x: -26
                    y: 83
                - label:
                    id: icon_ext_rest
                    text: "\uF1D4"
                    text_font: font_icons
                    text_color: 0x38BDF8
                    align: top_right
                    x: -2
                    y: 80

          - obj:
              id: card_battery
              x: 244
              y: 44
              width: 228
              height: 130
              styles: style_card
              widgets:
                - label:
                    id: icon_bat_card
                    text: "\uEBD2"
                    text_font: font_icons
                    styles: style_icon_normal
                    align: top_left
                - label:
                    text: "BATTERY"
                    text_font: font_card_header
                    styles: style_txt_normal
                    align: top_left
                    x: 24
                    y: 2
                - label:
                    id: lbl_bat_soc
                    text: "--%"
                    text_font: font_val_hero
                    styles: style_val_blue
                    align: left_mid
                    x: 4
                    y: 10
                - label:
                    id: lbl_bat_in
                    text: "In: -- W"
                    text_font: font_sub
