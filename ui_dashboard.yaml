font:
  - file: "gfonts://Inter"
    id: font_bar
    size: 13
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()+"
  - file: "gfonts://Inter"
    id: font_card_header
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%,>()+"
  - file: "gfonts://Inter"
    id: font_val_hero
    size: 28
    glyphs: "0123456789.-%°CWAV"
  - file: "gfonts://Inter"
    id: font_sub
    size: 12
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()+"
  - file:
      type: gfonts
      family: Inter
      weight: 600
    id: font_sub_title
    size: 16
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /:.-°%|,>()<+"

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 18
    glyphs:
      - "\uEB3A"
      - "\uE63E"
      - "\uE4D9"
      - "\uE648"
      - "\uE63C"
      - "\uE646"
      - "\uE1A4"
      - "\uEBDC"
      - "\uE0F0"
      - "\uE798"
      - "\uF076"
      - "\uEBD2"
      - "\uE81A"
      - "\uF172"
      - "\uE2BD"
      - "\uF176"
      - "\uEB3B"
      - "\uEBDB"
      - "\uE51C"
      - "\uEFD8"
      - "\uF879"
      - "\uE518"
      - "\uE166"
      - "\uE56C"
      - "\uF543"
      - "\uF1D4"
      - "\uE94D"  # Luftdruck (compress) 
      - "\uEF55" # local_fire_department / Flamme (Heat)
      - "\uF8D8" # toggle_off (Alternative)
      - "\uF8D9" # toggle_on (Alternative)
      - "\uE8AC" #// Off / Power


  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons_sub
    size: 26
    glyphs:
      # --- Geräte- / Location-Icons (links) ---
      - "\uE1A4" # battery_full (Battery)
      - "\uE56C" # kitchen (Kitchen)
      - "\uF543" # skillet (Cooker)
      - "\uF076" # thermostat (Climate)
      - "\uE63C" # power (Sonoff Main)
      # --- Zustands-Icons (rechts) ---
      - "\uE646" # power_off (1: Unavailable)
      - "\uE897" # lock (2: Locked)
      - "\uE8AC" # power_settings_new (3 & 4: Off / On)
      - "\uF8D8" # toggle_off (Alternative)
      - "\uF8D9" # toggle_on (Alternative)
      - "\uE166" # undo (Der geschwungene Rücksprung-Pfeil)
      # --- Klima-Modus Icons ---
      - "\uEB3B" # ac_unit / Schneeflocke (Cool)
      - "\uEF55" # local_fire_department / Flamme (Heat)
      - "\uF0EB"  # Lightbulb
      - "\ueb47" # (fridge-outline)
      - "\uE63E"  # LED / WLED
      - "\uF058F" # Water pump
      - "\uE798" # drop
      - "\uf3e3" #lightbulb (2)
      - "\uf0cf" #smart light

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons_hero
    size: 36
    glyphs:
      - "\uE646"
      - "\uE81A" # Sunny
      - "\uE51C" # Clear Night
      - "\uF172" # Partly Cloudy
      - "\uF176" # Rainy
      - "\uEBDB" # Lightning
      - "\uEB3B" # Snowy
      - "\uEFD8" # Windy
      - "\uE2BD" # Default / Unknown

