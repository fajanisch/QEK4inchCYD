                          text_font: font_sub
                          text_color: 0x38BDF8
                          align: bottom_left
                          x: 2
                          y: -4

                # 2. RIGHT CARD: Climate Control (228x176)
                - obj:
                    id: card_climate_control
                    x: 244
                    y: 0
                    width: 228
                    height: 176
                    styles: style_card
                    scrollable: false
                    scrollbar_mode: "off"
                    widgets:
                      - label:
                          text: "Climate Control"
                          text_font: font_sub_title
                          text_color: 0x38BDF8
                          align: top_left
                          x: 2
                          y: 2

                      # Mode Buttons (OFF / HEAT / COOL)
                      - obj:
                          id: btn_mode_off
                          x: 2
                          y: 38
                          width: 64
                          height: 36
                          styles: style_card
                          pad_all: 0
                          scrollable: false
                          scrollbar_mode: "off"
                          clickable: true
                          widgets:
                            - label:
                                text: "OFF"
                                text_font: font_sub
                                text_color: 0xE2E8F0
                                align: center
                          on_click:
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: climate.qek_klima
                                  hvac_mode: "off"

                      - obj:
                          id: btn_mode_heat
                          x: 73
                          y: 38
                          width: 64
                          height: 36
                          styles: style_card
                          pad_all: 0
                          scrollable: false
                          scrollbar_mode: "off"
                          clickable: true
                          widgets:
                            - label:
                                text: "HEAT"
                                text_font: font_sub
                                text_color: 0xE2E8F0
                                align: center
                          on_click:
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: climate.qek_klima
                                  hvac_mode: "heat"

                      - obj:
                          id: btn_mode_cool
                          x: 144
                          y: 38
                          width: 64
                          height: 36
                          styles: style_card
                          pad_all: 0
                          scrollable: false
                          scrollbar_mode: "off"
                          clickable: true
                          widgets:
                            - label:
                                text: "COOL"
                                text_font: font_sub
                                text_color: 0xE2E8F0
                                align: center
                          on_click:
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: climate.qek_klima
                                  hvac_mode: "cool"

                      # --- TARGET TEMPERATURE CONTROL (-1 / Toggle 21<->15 / +1) ---
                      # Minus Button (-1.0 °C)
                      - obj:
                          id: btn_temp_minus
                          x: 2
                          y: 96
                          width: 48
                          height: 48
                          styles: style_card
                          pad_all: 0
                          scrollable: false
                          scrollbar_mode: "off"
                          clickable: true
                          widgets:
                            - label:
                                text: "<"
                                text_font: font_sub_title
                                text_color: 0x38BDF8
                                align: center
                          on_click:
                            - homeassistant.service:
                                service: climate.set_temperature
                                data:
                                  entity_id: climate.qek_klima
                                  temperature: !lambda "if (isnan(id(ha_climate_target_temp).state)) return 20.0; return id(ha_climate_target_temp).state - 1.0;"

                      # Center Target Temp (Clickable: toggles between 21.0 and 15.0)
                      - obj:
                          id: btn_target_toggle
                          x: 56
                          y: 96
                          width: 98
                          height: 48
                          styles: style_card
                          pad_all: 0
                          scrollable: false
                          scrollbar_mode: "off"
                          clickable: true
                          widgets:
                            - label:
                                id: lbl_target_value
                                text: "21.0 °C"
                                text_font: font_sub_title
                                text_color: 0x38BDF8
                                align: center
                          on_click:
                            - homeassistant.service:
                                service: climate.set_temperature
                                data:
                                  entity_id: climate.qek_klima
                                  temperature: !lambda "if (isnan(id(ha_climate_target_temp).state)) return 21.0; if (id(ha_climate_target_temp).state >= 18.0) return 15.0; return 21.0;"

                      # Plus Button (+1.0 °C)
                      - obj:
                          id: btn_temp_plus
                          x: 160
                          y: 96
                          width: 48
                          height: 48
                          styles: style_card
                          pad_all: 0
                          scrollable: false
                          scrollbar_mode: "off"
                          clickable: true
                          widgets:
                            - label:
                                text: ">"
                                text_font: font_sub_title
                                text_color: 0x38BDF8
                                align: center
                          on_click:
                            - homeassistant.service:
                                service: climate.set_temperature
                                data:
                                  entity_id: climate.qek_klima
                                  temperature: !lambda "if (isnan(id(ha_climate_target_temp).state)) return 22.0; return id(ha_climate_target_temp).state + 1.0;"

                # 3. BACK BUTTON (228x84)
                - obj:
                    id: btn_sub_climate_back
