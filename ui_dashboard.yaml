                                text_color: 0x38BDF8
                                align: center
                          on_click:
                            then:
                              - homeassistant.service:
                                  service: input_number.decrement
                                  data:
                                    entity_id: input_number.c1000_max_soc
                              - script.execute: power_detail_timeout
                      - obj:
                          x: 48
                          y: 182
                          width: 124
                          height: 38
                          styles: style_card
                          shadow_width: 0
                          pad_all: 0
                          clickable: False
                          widgets:
                            - label:
                                id: lbl_c1000_max_val
                                text: !lambda |-
                                  float val = id(c1000_mirror_max_soc).state;
                                  if (isnan(val)) return "-- %";
                                  char buf[16];
                                  sprintf(buf, "%.0f %%", val);
                                  return std::string(buf);
                                text_font: font_card_header
                                text_color: 0x38BDF8
                                align: center
                      - obj:
                          x: 176
                          y: 182
                          width: 42
                          height: 38
                          styles: style_card
                          shadow_width: 0
                          pad_all: 0
                          clickable: True
                          widgets:
                            - label:
                                text: "+"
                                text_font: font_sub_title
                                text_color: 0x38BDF8
                                align: center
                          on_click:
                            then:
                              - homeassistant.service:
                                  service: input_number.increment
                                  data:
                                    entity_id: input_number.c1000_max_soc
                              - script.execute: power_detail_timeout
                              
