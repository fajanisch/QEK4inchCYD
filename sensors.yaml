    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            char buf[16];
            sprintf(buf, "Temp: %.1f °C", x);
            lv_label_set_text(id(lbl_out_temp_val), buf);
            if (x < 10.0 || x > 30.0) {
              lv_obj_set_style_text_color(id(lbl_out_temp_val), lv_color_hex(0xEAB308), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(id(lbl_out_temp_val), lv_color_hex(0x38BDF8), LV_PART_MAIN);
