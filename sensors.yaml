#---------------------------------------------------------------------------
# BINARY SENSORS
#---------------------------------------------------------------------------   
binary_sensor:
  - platform: homeassistant
    id: ha_auto_dim
    entity_id: binary_sensor.qek_qek_dashboard_4_0_cyd_auto_dim
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: ha_auto_dim
            then:
              - script.execute: dim_inactivity_timer
            else:
              - script.stop: dim_inactivity_timer
              - light.turn_on:
                  id: cyd_backlight
                  brightness: 80%
              - lvgl.widget.update:
                  id: dim_guard_overlay
                  clickable: false
                  hidden: true
  - platform: homeassistant
    entity_id: binary_sensor.qek_climate_available
    id: ha_climate_available

#---------------------------------------------------------------------------
# TEXT SENSORS
#---------------------------------------------------------------------------   
text_sensor:
  - platform: homeassistant
    id: qek_status_gps
    entity_id: sensor.qek_status_gps
    on_value:
      then:
        - lambda: |-
            if (x == "ok") {
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            } else if (x == "warn") {
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(id(badge_gps), lv_color_hex(0x64748B), LV_PART_MAIN);
            }

  - platform: homeassistant
    id: qek_status_pwr
    entity_id: sensor.qek_status_pwr
    on_value:
      then:
        - lambda: |-
            if (x == "disconnected") {
              lv_label_set_text(id(badge_pwr), "\uE646");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (x == "off") {
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (x == "warn") {
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              lv_label_set_text(id(badge_pwr), "\uE63C");
              lv_obj_set_style_text_color(id(badge_pwr), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(badge_pwr));

  - platform: homeassistant
    id: qek_status_wan
    entity_id: sensor.qek_status_wan
    on_value:
      then:
        - lambda: |-
            std::string val = x;
            for (auto &c : val) c = tolower(c);

            if (val == "none") {
              lv_label_set_text(id(badge_wan), "\uE648");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else if (val == "fair_warn" || val == "poor_warn") {
              lv_label_set_text(id(badge_wan), "\uE4D9");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              lv_label_set_text(id(badge_wan), "\uE63E");
              lv_obj_set_style_text_color(id(badge_wan), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(badge_wan));

  - platform: homeassistant
    id: qek_status_dew
    entity_id: sensor.qek_status_dew
    on_value:
      then:
        - lambda: |-
            auto color = lv_color_hex(0x38BDF8);
            if (x == "alarm") {
              color = lv_color_hex(0xEF4444);
            } else if (x == "warn") {
              color = lv_color_hex(0xFBBF24);
            } else if (x == "ok") {
              color = lv_color_hex(0x38BDF8);
            } else {
              color = lv_color_hex(0x64748B);
            }
            lv_obj_set_style_text_color(id(icon_climate_dew), color, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_in_dew), color, LV_PART_MAIN);
            lv_obj_invalidate(id(icon_climate_dew));
            lv_obj_invalidate(id(icon_in_dew));

  - platform: homeassistant
    id: qek_weather_cond
    entity_id: weather.forecast_home
    on_value:
      then:
        - lambda: |-
            std::string cond = x;
            for (auto &c : cond) c = tolower(c);
            std::string icon_code = "\uE2BD";

            if (cond == "sunny") { 
              icon_code = "\uE81A"; 
            } else if (cond == "clear-night") { 
              icon_code = "\uE51C"; 
            } else if (cond == "partlycloudy") { 
              icon_code = "\uF172"; 
            } else if (cond == "rainy" || cond == "pouring") { 
              icon_code = "\uF176"; 
            } else if (cond == "lightning" || cond == "lightning-rainy") { 
              icon_code = "\uEBDB"; 
            } else if (cond == "snowy" || cond == "snowy-rainy" || cond == "hail") { 
              icon_code = "\uEB3B"; 
            } else if (cond == "windy" || cond == "windy-variant" || cond == "fog") { 
              icon_code = "\uEFD8"; 
            }

            lv_label_set_text(id(icon_climate_wx), icon_code.c_str());
            lv_label_set_text(id(icon_climate_wx_sub), icon_code.c_str());
            
            auto color = lv_color_hex(0x38BDF8);
            if (cond == "sunny" || cond == "lightning" || cond == "lightning-rainy") {
              color = lv_color_hex(0xFBBF24);
            }
            lv_obj_set_style_text_color(id(icon_climate_wx), color, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_climate_wx_sub), color, LV_PART_MAIN);
            
            lv_obj_invalidate(id(icon_climate_wx));
            lv_obj_invalidate(id(icon_climate_wx_sub));

  - platform: homeassistant
    id: qek_weather_summary
    entity_id: sensor.qek_weather_summary
    on_value:
      then:
        - lambda: |-
            lv_label_set_text(id(lbl_climate_wx), x.c_str());
            if (x == "Weather: Offline" || x == "Offline" || x == "unavailable" || x == "unknown") {
              lv_obj_set_style_text_color(id(lbl_climate_wx), lv_color_hex(0x64748B), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_climate_wx), lv_color_hex(0x64748B), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(id(lbl_climate_wx), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(lbl_climate_wx));
            lv_obj_invalidate(id(icon_climate_wx));

  - platform: homeassistant
    id: ext_pwr_switch_state
    entity_id: switch.matter_over_wifi_smart_switch
    on_value:
      then:
        - script.execute: update_ext_pwr_hero

  - platform: homeassistant
    id: ext_bat_switch_state
    entity_id: switch.qek_shelly_c1000_ac_charger
    on_value:
      then:
        - script.execute: update_shelly_bat

  - platform: homeassistant
    id: ext_kitchen_switch_state
    entity_id: switch.qek_shelly_kitchen
    on_value:
      then:
        - script.execute: update_shelly_kitchen

  - platform: homeassistant
    id: ext_cooker_switch_state
    entity_id: switch.qek_shelly_cooker
    on_value:
      then:
        - script.execute: update_shelly_cooker

  - platform: homeassistant
    id: ext_climate_switch_state
    entity_id: switch.qek_shelly_climate_co
    on_value:
      then:
        - script.execute: update_shelly_climate

  - platform: homeassistant
    entity_id: input_select.qek_climate_mode
    id: ha_climate_mode_state
    on_value:
      then:
        - lambda: |-
            std::string mode = x;
            std::string shelly_state = id(ext_climate_switch_state).state;

            auto col_text = lv_color_hex(0x38BDF8);
            auto col_border = lv_color_hex(0x334155);
            
            auto text_off = col_text;
            auto text_heat = col_text;
            auto text_cool = col_text;
            auto border_off = col_border;
            auto border_heat = col_border;
            auto border_cool = col_border;
            int width_off = 1, width_heat = 1, width_cool = 1;

            if (shelly_state == "unavailable" || shelly_state == "unknown") {
              auto gray = lv_color_hex(0x64748B);
              text_off = gray; text_heat = gray; text_cool = gray;
            } else {
              if (mode == "off") {
                text_off = lv_color_hex(0xFBBF24);
                border_off = lv_color_hex(0xFBBF24);
                width_off = 2;
              } else if (mode == "heat") {
                text_heat = lv_color_hex(0xFBBF24);
                border_heat = lv_color_hex(0xFBBF24);
                width_heat = 2;
              } else if (mode == "cool") {
                text_cool = lv_color_hex(0xFBBF24);
                border_cool = lv_color_hex(0xFBBF24);
                width_cool = 2;
              }
            }

            lv_obj_set_style_border_color(id(btn_mode_off), border_off, LV_PART_MAIN);
            lv_obj_set_style_border_width(id(btn_mode_off), width_off, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_mode_off), text_off, LV_PART_MAIN);

            lv_obj_set_style_border_color(id(btn_mode_heat), border_heat, LV_PART_MAIN);
            lv_obj_set_style_border_width(id(btn_mode_heat), width_heat, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_mode_heat), text_heat, LV_PART_MAIN);

            lv_obj_set_style_border_color(id(btn_mode_cool), border_cool, LV_PART_MAIN);
            lv_obj_set_style_border_width(id(btn_mode_cool), width_cool, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_mode_cool), text_cool, LV_PART_MAIN);

            lv_obj_invalidate(id(btn_mode_off));
            lv_obj_invalidate(id(btn_mode_heat));
            lv_obj_invalidate(id(btn_mode_cool));

            std::string icon_code = "\uE8AC";
            if (mode == "heat") {
              icon_code = "\uEF55";
            } else if (mode == "cool") {
              icon_code = "\uEB3B";
            } else if (mode == "off") {
              icon_code = "\uE8AC";
            }

            lv_label_set_text(id(icon_climate_mode), icon_code.c_str());
            lv_obj_invalidate(id(icon_climate_mode));

  - platform: homeassistant
    id: bat_time_remaining
    entity_id: sensor.qek_battery_time_remaining
    on_value:
      then:
        - lambda: |-
            std::string t_str = x;
            if (t_str.empty() || t_str == "unavailable" || t_str == "unknown") {
              t_str = "--h --m";
            }
            
            // Hauptbildschirm-Label aktualisieren
            lv_label_set_text(id(lbl_bat_remaining), t_str.c_str());
            lv_obj_invalidate(id(lbl_bat_remaining));
            
            // Subscreen (Statistik) aktualisieren
            lv_label_set_text(id(lbl_stat_timeremaining), t_str.c_str());
            lv_obj_invalidate(id(lbl_stat_timeremaining));
#-------------------------------------------------------------
# NUMERIC SENSORS
#-------------------------------------------------------------
sensor:
  # --- 1. LOCAL HARDWARE SENSOR (DHT22) ---
  - platform: dht
    pin: GPIO21
    model: AM2302
    update_interval: 15s
    temperature:
      name: "CYD QEK Temperatur"
      id: cyd_qek_temperatur
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
      on_value:
        then:
          - lambda: |-
              char buf[32];
              sprintf(buf, "%.1f°C", x);
              lv_label_set_text(id(lbl_climate_temp), buf);
              lv_label_set_text(id(lbl_in_temp_val), buf);

              auto color = lv_color_hex(0x38BDF8);
              if (x >= 28.0) {
                color = lv_color_hex(0xEF4444);
              } else if (x <= 12.0 || x >= 24.0) {
                color = lv_color_hex(0xFBBF24);
              }
              lv_obj_set_style_text_color(id(lbl_climate_temp), color, LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_climate_card), color, LV_PART_MAIN);
              lv_obj_set_style_text_color(id(lbl_in_temp_val), color, LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_in_temp), color, LV_PART_MAIN);
              
              lv_obj_invalidate(id(lbl_climate_temp));
              lv_obj_invalidate(id(icon_climate_card));
              lv_obj_invalidate(id(lbl_in_temp_val));
              lv_obj_invalidate(id(icon_in_temp));

    humidity:
      name: "CYD QEK Luftfeuchtigkeit"
      id: cyd_qek_luftfeuchtigkeit
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: |-
              char buf[32];
              sprintf(buf, "%.0f%%", x);
              lv_label_set_text(id(lbl_climate_hum), buf);
              sprintf(buf, "%.0f%%", x);
              lv_label_set_text(id(lbl_in_hum_val), buf);

  # --- TAUHÖHE / DEW POINT ---
  - platform: homeassistant
    id: qek_dew_point
    entity_id: sensor.qek_dew_point
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              char buf[32];
              sprintf(buf, "%.1f°C", x);
              lv_label_set_text(id(lbl_climate_dew), buf);
              lv_label_set_text(id(lbl_in_dew_val), buf);
            } else {
              lv_label_set_text(id(lbl_climate_dew), "--.-°C");
              lv_label_set_text(id(lbl_in_dew_val), "--.-°C");
            }
            lv_obj_invalidate(id(lbl_climate_dew));
            lv_obj_invalidate(id(lbl_in_dew_val));
                        
  # --- 2. BATTERY & POWER SENSORS ---
  - platform: homeassistant
    id: bat_out
    entity_id: sensor.anker_solix_c1000_total_power_out
    on_value:
      then:
        - lambda: |-
            int out_w = (int)x;
            lv_label_set_text_fmt(id(lbl_bat_out), "Out: %d W", out_w);
            lv_obj_invalidate(id(lbl_bat_out));
            
  - platform: homeassistant
    id: c1000_soc_rate
    entity_id: sensor.qek_solix_c300ac_qek_prediction_battery
    on_value:
      then:
        - lambda: |-
            if (x > 0.3) {
              lv_label_set_text(id(icon_bat_target), "\uE1A4");
              lv_obj_set_style_text_color(id(icon_bat_target), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            } else if (x < -0.2) {
              lv_label_set_text(id(icon_bat_target), "\uEBDC");
              lv_obj_set_style_text_color(id(icon_bat_target), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              lv_label_set_text(id(icon_bat_target), "\uEBD2");
              lv_obj_set_style_text_color(id(icon_bat_target), lv_color_hex(0x64748B), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(icon_bat_target));

  - platform: homeassistant
    id: ext_pwr_watt
    entity_id: sensor.matter_over_wifi_smart_switch_power
    on_value:
      then:
        - script.execute: update_ext_pwr_hero

  - platform: homeassistant
    id: ext_pwr_current
    entity_id: sensor.matter_over_wifi_smart_switch_active_current
    on_value:
      then:
        - script.execute: update_ext_pwr_hero

  - platform: homeassistant
    id: ext_bat_power
    entity_id: sensor.qek_shelly_c1000_ac_charger_power
    on_value:
      then:
        - script.execute: update_shelly_bat

  - platform: homeassistant
    id: ext_kitchen_power
    entity_id: sensor.qek_shelly_kitchen_power
    on_value:
      then:
        - script.execute: update_shelly_kitchen

  - platform: homeassistant
    id: ext_cooker_power
    entity_id: sensor.qek_shelly_cooker_power
    on_value:
      then:
        - script.execute: update_shelly_cooker

  - platform: homeassistant
    id: ext_climate_power
    entity_id: sensor.qek_shelly_climate_co_power
    on_value:
      then:
        - script.execute: update_shelly_climate

  - platform: homeassistant
    id: ext_rest_power
    entity_id: sensor.qek_other_power_consumption
    on_value:
      then:
        - script.execute: update_rest

  # --- TAGESENERGY (kWh aus HA -> Wh in ESPHome) ---
  - platform: homeassistant
    id: ext_pwr_wh
    entity_id: sensor.qek_sonoff_energy_daily
    filters:
      - multiply: 1000.0
    on_value:
      then:
        - script.execute: update_ext_pwr_hero

  - platform: homeassistant
    id: ext_bat_wh
    entity_id: sensor.qek_bat_energy_daily
    filters:
      - multiply: 1000.0
    on_value:
      then:
        - script.execute: update_shelly_bat

  - platform: homeassistant
    id: ext_kitchen_wh
    entity_id: sensor.qek_kitchen_energy_daily
    filters:
      - multiply: 1000.0
    on_value:
      then:
        - script.execute: update_shelly_kitchen

  - platform: homeassistant
    id: ext_cooker_wh
    entity_id: sensor.qek_cooker_energy_daily
    filters:
      - multiply: 1000.0
    on_value:
      then:
        - script.execute: update_shelly_cooker

  - platform: homeassistant
    id: ext_climate_wh
    entity_id: sensor.qek_climate_energy_daily
    filters:
      - multiply: 1000.0
    on_value:
      then:
        - script.execute: update_shelly_climate

  - platform: homeassistant
    entity_id: input_number.qek_target_temp
    id: ha_climate_target_temp
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "%.1f°C", x);
            lv_label_set_text(id(lbl_target_value), buf);
            lv_obj_invalidate(id(lbl_target_value));
            lv_label_set_text(id(lbl_climate_target), buf);
            lv_obj_invalidate(id(lbl_climate_target));
                      
  # --- 3. WEATHER & FORECAST SENSORS ---
  - platform: homeassistant
    entity_id: weather.forecast_home
    id: ext_weather_temp
    attribute: temperature
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              char buf[16];
              sprintf(buf, "%.1f°C", x);
              lv_label_set_text(id(lbl_out_temp_val), buf);
              if (x < 10.0 || x > 30.0) {
                lv_obj_set_style_text_color(id(lbl_out_temp_val), lv_color_hex(0xEAB308), LV_PART_MAIN);
              } else {
                lv_obj_set_style_text_color(id(lbl_out_temp_val), lv_color_hex(0x38BDF8), LV_PART_MAIN);
              }
            }

  - platform: homeassistant
    entity_id: weather.forecast_home
    id: ext_weather_wind
    attribute: wind_speed
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              char buf[16];
              sprintf(buf, "%.1f km/h", x);
              lv_label_set_text(id(lbl_out_wind_val), buf);
            }

  - platform: homeassistant
    entity_id: weather.forecast_home
    id: ext_weather_pressure
    attribute: pressure
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              char buf[16];
              sprintf(buf, "%d hPa", (int)x);
              lv_label_set_text(id(lbl_out_press_val), buf);
            }

  - platform: homeassistant
    entity_id: weather.forecast_home
    id: ext_weather_humidity
    attribute: humidity
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              char buf[16];
              sprintf(buf, "%d%%", (int)x);
              lv_label_set_text(id(lbl_out_hum_val), buf);
            }

  # --- INTERNAL CYD BATTERY ---
  - platform: adc
    pin: GPIO9
    id: cyd_batt_raw_voltage
    name: "CYD Battery Voltage"
    update_interval: 60s
    attenuation: 11dB
    filters:
      - multiply: 2.0

  - platform: template
    name: "CYD Battery Status Manager"
    id: cyd_battery_pct
    update_interval: 60s
    lambda: |-
      float v = id(cyd_batt_raw_voltage).state;
      if (isnan(v) || v < 0.1) return 50.0;
      
      float pct = (v - 3.3) / (4.2 - 3.3) * 100.0;
      if (pct < 0) return 0.0;
      if (pct > 100) return 100.0;
      return pct;
    on_value:
      then:
        - lambda: |-
            int soc = (int)x;
            char buf[16];
            sprintf(buf, "%d%%", soc);
            lv_label_set_text(id(lbl_status_batt_pct), buf);
            
            float v = id(cyd_batt_raw_voltage).state;
            bool is_charging = (v > 3.95); 

            auto color = lv_color_hex(0x38BDF8);
            
            if (is_charging) {
              lv_label_set_text(id(badge_charging), "\uE1A3");
              color = lv_color_hex(0x38BDF8);
            } else {
              lv_label_set_text(id(badge_charging), "\uE1A4");
              if (soc < 20) {
                color = lv_color_hex(0xEF4444);
              } else if (soc < 30) {
                color = lv_color_hex(0xFBBF24);
              }
            }
            
            lv_obj_set_style_text_color(id(lbl_status_batt_pct), color, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(badge_charging), color, LV_PART_MAIN);
            lv_obj_invalidate(id(lbl_status_batt_pct));
            lv_obj_invalidate(id(badge_charging));

  # --- C1000 CHARGE CONTROL ---
  - platform: homeassistant
    entity_id: input_number.c1000_min_soc
    id: c1000_mirror_min_soc
    name: "C1000 Mirror Min SoC"
    force_update: true
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "%.0f %%", x);
            lv_label_set_text(id(lbl_c1000_min_val), buf);
            lv_obj_invalidate(id(lbl_c1000_min_val));

  - platform: homeassistant
    entity_id: input_number.c1000_max_soc
    id: c1000_mirror_max_soc
    name: "C1000 Mirror Max SoC"
    force_update: true
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "%.0f %%", x);
            lv_label_set_text(id(lbl_c1000_max_val), buf);
            lv_obj_invalidate(id(lbl_c1000_max_val));

  #-------------------------------------------------------------
  # BATTERY STATS & MAIN SCREEN MAPPINGS
  #-------------------------------------------------------------
  - platform: homeassistant
    id: c1000_soc
    entity_id: sensor.anker_solix_c1000_battery_percentage
    on_value:
      then:
        - lambda: |-
            int soc = (int)x;
            lv_label_set_text_fmt(id(lbl_bat_soc), "%d%%", soc);
            lv_label_set_text_fmt(id(lbl_stat_soc), "%d%%", soc);

            if (soc < 20) {
              lv_obj_set_style_text_color(id(lbl_bat_soc), lv_color_hex(0xEF4444), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_bat_card), lv_color_hex(0xEF4444), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(lbl_stat_soc), lv_color_hex(0xEF4444), LV_PART_MAIN);
            } else if (soc < 30) {
              lv_obj_set_style_text_color(id(lbl_bat_soc), lv_color_hex(0xFBBF24), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_bat_card), lv_color_hex(0xFBBF24), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(lbl_stat_soc), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(id(lbl_bat_soc), lv_color_hex(0x38BDF8), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(icon_bat_card), lv_color_hex(0x38BDF8), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(lbl_stat_soc), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            }
            lv_obj_invalidate(id(lbl_bat_soc));
            lv_obj_invalidate(id(icon_bat_card));
            lv_obj_invalidate(id(lbl_stat_soc));
            
  # --- CSV STATS MAPPINGS (7 Zeilen) ---
  - platform: homeassistant
    entity_id: sensor.anker_solix_c1000_ac_power_in
    id: stat_c1000_ac_in
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "%.0f W", x);
            lv_label_set_text(id(lbl_stat_ac_in), buf);
            lv_obj_invalidate(id(lbl_stat_ac_in));

  - platform: homeassistant
    entity_id: sensor.qek_anker_solix_c1000_ac_energy_in_today
    id: stat_c1000_ac_energy_today
    on_value:
      then:
        - lambda: |-
            char buf[32];
            if (isnan(x)) {
              snprintf(buf, sizeof(buf), "0 Wh");
            } else {
              snprintf(buf, sizeof(buf), "%.0f Wh", (x * 1000.0) + 0.5);
            }
            lv_label_set_text(id(lbl_stat_ac_energy_today), buf);
            lv_obj_invalidate(id(lbl_stat_ac_energy_today));

