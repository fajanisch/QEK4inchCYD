script:
  - id: cyd_show_message
    mode: restart
    parameters:
      title: string
      message: string
      duration: int
    then:
      - lvgl.label.update:
          id: cyd_msg_title
          text: !lambda |-
            return title;
      - lvgl.label.update:
          id: cyd_msg_text
          text: !lambda |-
            return message;
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - lvgl.widget.show: cyd_msg
      - if:
          condition:
            lambda: !lambda |-
              return duration > 0;
          then:
            - delay: !lambda |-
                return (uint32_t) duration * 1000;
            - lvgl.widget.hide: cyd_msg

  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");

  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"QEK"};
            if (page < 0 || page >= 1) return std::string("");
            return std::string(names[page]);

# ==============================================================================
# LVGL GRAFIK-ENGINE (Rotation 90° exklusiv hier definiert)
# ==============================================================================
lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 90
  page_wrap: true
  theme:
    button:
      bg_color: 0x000000
      bg_opa: COVER
      radius: 6
      border_width: 0
      border_color: 0x000000
      shadow_width: 0
      pad_all: 6
      text_color: 0xFFFFFF
      pressed:
        bg_color: 0xFFD400
      checked:
        bg_color: 0xFFD400
        bg_opa: COVER
        border_color: 0xFFD400
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x000000
      bg_opa: COVER
      radius: 6
      border_width: 0
      border_color: 0x000000
      pad_all: 6
      shadow_width: 0
    - id: cyd_plain
