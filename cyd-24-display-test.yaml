      text_font: icons_20
      text_color: 0xFFD400
    - id: cyd_text_9
      text_font: font_16
      text_color: 0xFFFFFF
  on_idle:
    - timeout: 30s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 0;
            then:
              - lvgl.page.show: page_home
    - timeout: 180s
      then:
        - lambda: !lambda |-
            id(cyd_dimmed) = true;
        - light.turn_on:
            id: backlight
            brightness: "25%"
  top_layer:
