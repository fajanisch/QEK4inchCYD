# ======================================================================
# Erzeugt von CYD Studio – Angepasst für ESP32-2432S028R (ST7789V / GPIO27 Backlight)
# Projekt: QEK-CYD · Board: Cheap Yellow Display 2,8″
# ======================================================================

substitutions:
  device_name: qek-cyd
  friendly_name: QEK-CYD
  ent_binary_sensor_qek_1_1_1_1: binary_sensor.qek_1_1_1_1
  ent_sensor_anker_solix_c1000_battery_percentage: sensor.anker_solix_c1000_battery_percentage
  ent_sensor_anker_solix_c1000_total_power_in: sensor.anker_solix_c1000_total_power_in
  ent_sensor_anker_solix_c1000_total_power_out: sensor.anker_solix_c1000_total_power_out
  ent_sensor_qek_shelly_c1000_ac_charger_power: sensor.qek_shelly_c1000_ac_charger_power
  ent_switch_qek_shelly_c1000_ac_charger: switch.qek_shelly_c1000_ac_charger

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: 1000.0
    then:
      - lambda: |-
          pinMode(33, OUTPUT);
          digitalWrite(33, HIGH);
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 115200
  level: DEBUG

api:
  encryption:
    key: "eW+9RP3mF6uyoPd81ohYnwd9w95FDZt5byF3LNjw7xA="
  actions:
    - action: show_page
      variables:
        page: string
      then:
        - light.turn_on:
            id: backlight
            brightness: "100%"
        - if:
            condition:
              lambda: !lambda |-
                return page == "QEK" || page == "home";
            then:
              - lvgl.page.show: page_home
    - action: show_message
      variables:
        title: string
        message: string
        duration: int
      then:
        - script.execute:
            id: cyd_show_message
            title: !lambda |-
              return title.str();
            message: !lambda |-
              return message.str();
            duration: !lambda |-
              return duration;
    - action: wake
      then:
        - light.turn_on:
            id: backlight
            brightness: "100%"
    - action: dim
      then:
        - light.turn_on:
            id: backlight
            brightness: "25%"
    - action: set_brightness
      variables:
        brightness: int
      then:
        - light.turn_on:
            id: backlight
            brightness: !lambda |-
              return std::max(1, std::min(100, (int) brightness)) / 100.0f;
    - action: set_led
      variables:
        red: int
        green: int
        blue: int
      then:
        - if:
            condition:
              lambda: !lambda |-
                return (int) red <= 0 && (int) green <= 0 && (int) blue <= 0;
            then:
              - light.turn_off: status_led
            else:
              - light.turn_on:
                  id: status_led
                  brightness: "100%"
                  red: !lambda |-
                    return std::min(255, std::max(0, (int) red)) / 255.0f;
                  green: !lambda |-
                    return std::min(255, std::max(0, (int) green)) / 255.0f;
                  blue: !lambda |-
                    return std::min(255, std::max(0, (int) blue)) / 255.0f;

ota:
  - platform: esphome
    id: cyd_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "QEK-CYD Fallback"

captive_portal:

# ==============================================================================
# HARDWARE SPI BUS
# ==============================================================================
spi:
  - id: cyd_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# ==============================================================================
# HARDWARE DISPLAY (ST7789V mipi_spi - ohne Display-Rotation)
# ==============================================================================
display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: cyd_spi
    model: ST7789V
    data_rate: 20MHz
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    dimensions:
      width: 240
      height: 320
      offset_height: 0
      offset_width: 0
    invert_colors: true
    color_order: BGR
    update_interval: never
    auto_clear_enabled: false

# ==============================================================================
# HARDWARE TOUCHSCREEN (XPT2046) - ACHSEN FÜR QUERFORMAT ANGEPASST
# ==============================================================================
touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: cyd_spi
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 20ms
    threshold: 300
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      - if:
          condition:
            lambda: !lambda |-
              return id(cyd_dimmed);
          then:
            - lambda: !lambda |-
                id(cyd_dimmed) = false;
            - light.turn_on:
                id: backlight
                brightness: "100%"

# ==============================================================================
# HARDWARE PINS & BELEUCHTUNG (GPIO27 für Backlight)
# ==============================================================================
output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
  - platform: ledc
    id: led_red
    pin: GPIO4
    inverted: true
  - platform: ledc
    id: led_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display backlight"
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: rgb
    name: "Status LED"
    id: status_led
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: ALWAYS_OFF

globals:
  - id: cyd_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: cyd_dimmed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cyd_tile_state
    type: "std::function<void(lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, const std::string &, float, int, const char *, const char *, const uint32_t *)>"
    restore_value: false
    initial_value: |-
      [](lv_obj_t *tile, lv_obj_t *icon, lv_obj_t *title, lv_obj_t *label, lv_obj_t *circle,
          const std::string &x, float value, int kind, const char *text_on, const char *text_off,
          const uint32_t *c) {
        const bool on = x == "on" || x == "open" || x == "opening" || x == "unlocked" || x == "home" || x == "playing";
        const int k = on ? 0 : 1;
        if (tile != nullptr) {
          lv_obj_set_state(tile, LV_STATE_CHECKED, on);
          lv_obj_set_state(tile, LV_STATE_DISABLED, x == "unavailable");
        }
        if (icon != nullptr) lv_obj_set_style_text_color(icon, lv_color_hex(c[k]), LV_PART_MAIN);
        if (title != nullptr) lv_obj_set_style_text_color(title, lv_color_hex(c[2 + k]), LV_PART_MAIN);
        if (circle != nullptr) lv_obj_set_style_bg_color(circle, lv_color_hex(c[6 + k]), LV_PART_MAIN);
        if (label == nullptr) return;
        lv_obj_set_style_text_color(label, lv_color_hex(c[4 + k]), LV_PART_MAIN);
        std::string text;
        if (on && kind > 0 && !std::isnan(value)) {
          char buf[12];
          snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(kind == 1 ? value * 100.0f / 255.0f : value));
          text = buf;
        }
        else if (x == "unavailable") text = "Unavailable";
        else if (x.empty() || x == "unknown") text = "–";
        else if (x == "opening") text = "Opening";
        else if (x == "closing") text = "Closing";
        else if (on && text_on != nullptr) text = text_on;
        else if (!on && text_off != nullptr) text = text_off;
        else if (x == "on") text = "On";
        else if (x == "off") text = "Off";
        else if (x == "open") text = "Open";
        else if (x == "closed") text = "Closed";
        else if (x == "locked") text = "Locked";
        else if (x == "unlocked") text = "Unlocked";
        else text = x;
        lv_label_set_text(label, text.c_str());
      }

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: cyd_update_time
    on_time:
      - seconds: 0
        minutes: "/1"
        then:
          - script.execute: cyd_update_time

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic
  - platform: homeassistant
    id: ha_sensor_qek_shelly_c1000_ac_charger_power_num
    entity_id: "${ent_sensor_qek_shelly_c1000_ac_charger_power}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_home_w2_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf) + " W";
  - platform: homeassistant
    id: ha_sensor_anker_solix_c1000_battery_percentage_num
    entity_id: "${ent_sensor_anker_solix_c1000_battery_percentage}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_home_w3_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf) + " %";
        - lvgl.arc.update:
            id: w_home_w5_arc
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int) lroundf(std::min((float) 100, std::max((float) 0, x)));
        - lvgl.label.update:
            id: w_home_w5_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_sensor_anker_solix_c1000_total_power_in_num
    entity_id: "${ent_sensor_anker_solix_c1000_total_power_in}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_home_w4_v0
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf) + " W";
  - platform: homeassistant
    id: ha_sensor_anker_solix_c1000_total_power_out_num
    entity_id: "${ent_sensor_anker_solix_c1000_total_power_out}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_home_w4_v1
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf) + " W";

text_sensor:
  - platform: homeassistant
    id: ha_switch_qek_shelly_c1000_ac_charger
    entity_id: "${ent_switch_qek_shelly_c1000_ac_charger}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xFFFFFF, 0x000000, 0xFFFFFF, 0x000000, 0xFFFFFF, 0xFFD400, 0xFFD400};
            id(cyd_tile_state)(id(w_home_w1), id(w_home_w1_icon), id(w_home_w1_label), id(w_home_w1_state), id(w_home_w1_circle), x, NAN, 0, nullptr, nullptr, c);
  - platform: homeassistant
    id: ha_binary_sensor_qek_1_1_1_1
    entity_id: "${ent_binary_sensor_qek_1_1_1_1}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xFFD400, 0x646464, 0xFFFFFF, 0xFFFFFF, 0xFFFFFF, 0xFFFFFF, 0xFFD400, 0xFFD400};
            id(cyd_tile_state)(nullptr, id(w_home_w6_icon), nullptr, id(w_home_w6_state), nullptr, x, NAN, 0, "up", "down", c);

