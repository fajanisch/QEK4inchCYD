      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_text_1
      text_font: icons_20
      text_color: 0xFFFFFF
    - id: cyd_text_2
      text_font: font_14
      text_color: 0xFFFFFF
    - id: cyd_text_3
      text_font: font_12
      text_color: 0xFFFFFF
    - id: cyd_text_4
      text_font: font_20
      text_color: 0xFFFFFF
