esphome:
  name: qek-cyd-panel
  on_boot:
    priority: 1000.0
    then:
      - lambda: |-
          pinMode(33, OUTPUT);
          digitalWrite(33, HIGH);

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 115200
  level: DEBUG

web_server:
  port: 80

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password
#  power_save_mode: NONE
wifi:
  networks:
    - ssid: "HollyShort"
      password: "W3L0v3C4mp1ng"
      priority: 10.0
    - ssid: "GROUNDFLOOR"
      password: "Die Trulla rennt fuer Whiskas!"
      priority: 5.0

  # Fallback-AP aktiv lassen, falls gar kein Netz greift
  ap:
    ssid: "QEK-CYD-Fallback"
    password: "fallbackpassword"
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

# Hardware SPI Bus
spi:
  - id: cyd_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# 1. Touchscreen Controller (XPT2046)
touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: cyd_spi
    cs_pin: GPIO33
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 300
      x_max: 3800
      y_min: 300
      y_max: 3800
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

# 2. Touch-Bereich für Zuleitung (Rechte untere Kachel: x=170..310, y=135..225)
binary_sensor:
  - platform: touchscreen
    touchscreen_id: cyd_touch
    name: "Sonoff Einspeisung Touch"
    x_min: 165
    x_max: 310
    y_min: 135
    y_max: 230
    filters:
      - delayed_off: 300ms
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("touch_action", "Button Pressed: Sonoff Einspeisung Toggle");
        - switch.toggle: sonoff_einspeisung_switch

# 3. Importierte Sensoren aus Home Assistant
sensor:
  - platform: homeassistant
    id: solix_soc
    entity_id: sensor.anker_solix_c1000_battery_percentage
    on_value:
      - component.update: my_display

  - platform: homeassistant
    id: solar_power
    entity_id: sensor.solix_solar_input_power
    on_value:
      - component.update: my_display

  - platform: homeassistant
    id: solar_daily_yield
    entity_id: sensor.solix_solar_daily_yield
    on_value:
      - component.update: my_display

  - platform: homeassistant
    id: grid_daily_energy
    entity_id: sensor.sonoff_einspeisung_daily_energy
    on_value:
      - component.update: my_display

  - platform: wifi_signal
    name: "CYD Wi-Fi Signal"
    id: wifi_dbm
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "CYD IP Address"
      id: ip_address_sensor

# 4. Importierter Schalter für das Sonoff-Relais
switch:
  - platform: homeassistant
    id: sonoff_einspeisung_switch
    entity_id: switch.sonoff_einspeisung_hutschiene
    on_state:
      - component.update: my_display

# 5. Farbdefinitionen
color:
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_green
    red: 0%
    green: 80%
    blue: 20%
  - id: my_red
    red: 80%
    green: 10%
    blue: 10%
  - id: my_card_bg
    red: 12%
    green: 12%
    blue: 12%
  - id: my_border
    red: 25%
    green: 25%
    blue: 25%
  - id: my_solar_yellow
    red: 100%
    green: 75%
    blue: 0%
  - id: my_grid_blue
    red: 25%
    green: 70%
    blue: 100%
  - id: my_gray
    red: 60%
    green: 60%
    blue: 60%

# 6. Schriftarten
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 16
  - file: "gfonts://Roboto"
    id: font_header
    size: 12
  - file: "gfonts://Roboto"
    id: font_val_large
    size: 26
  - file: "gfonts://Roboto"
    id: font_val_small
    size: 14

# 7. Display-Konfiguration (ST7789V 240x320 @ 90° = 320x240)
display:
  - platform: mipi_spi
    model: ST7789V
    id: my_display
    spi_id: cyd_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    data_rate: 20MHz
    dimensions:
      width: 240
      height: 320
      offset_height: 0
      offset_width: 0
    invert_colors: true
    color_order: RGB
    rotation: 90
    lambda: |-
      // Hintergrund und Kopfzeile
      it.fill(id(my_black));
      it.print(160, 14, id(font_title), id(my_white), TextAlign::CENTER, "QEK ENERGIE MONITOR");

      // --- KACHEL 1: AKKU C1000X (Oben Links) ---
      it.filled_rectangle(10, 32, 140, 90, id(my_card_bg));
      it.rectangle(10, 32, 140, 90, id(my_border));
      it.print(18, 40, id(font_header), id(my_gray), TextAlign::TOP_LEFT, "AKKU C1000X");

      if (isnan(id(solix_soc).state)) {
        it.print(80, 80, id(font_val_large), id(my_gray), TextAlign::CENTER, "-- %");
      } else {
        float soc = id(solix_soc).state;
        Color soc_color = (soc < 20.0f) ? id(my_red) : id(my_green);
        it.printf(80, 80, id(font_val_large), soc_color, TextAlign::CENTER, "%.0f%%", soc);
      }

      // --- KACHEL 2: SOLAR DACH (Oben Rechts) ---
      it.filled_rectangle(170, 32, 140, 90, id(my_card_bg));
      it.rectangle(170, 32, 140, 90, id(my_border));
      it.print(178, 40, id(font_header), id(my_gray), TextAlign::TOP_LEFT, "SOLAR (400Wp)");

      float p_solar = isnan(id(solar_power).state) ? 0.0f : id(solar_power).state;
      float e_solar = isnan(id(solar_daily_yield).state) ? 0.0f : id(solar_daily_yield).state;
      it.printf(240, 70, id(font_val_large), id(my_solar_yellow), TextAlign::CENTER, "%.0f W", p_solar);
      it.printf(240, 102, id(font_val_small), id(my_white), TextAlign::CENTER, "Heute: %.2f kWh", e_solar);

      // --- KACHEL 3: NETZ / AUTO BEZUG (Unten Links) ---
      it.filled_rectangle(10, 135, 140, 90, id(my_card_bg));
      it.rectangle(10, 135, 140, 90, id(my_border));
      it.print(18, 143, id(font_header), id(my_gray), TextAlign::TOP_LEFT, "NETZ / AUTO BEZUG");

      float e_grid = isnan(id(grid_daily_energy).state) ? 0.0f : id(grid_daily_energy).state;
      it.printf(80, 175, id(font_val_large), id(my_grid_blue), TextAlign::CENTER, "%.2f", e_grid);
      it.print(80, 204, id(font_val_small), id(my_white), TextAlign::CENTER, "kWh heute");

      // --- KACHEL 4: ZULEITUNG SCHALTER (Unten Rechts) ---
      bool grid_on = id(sonoff_einspeisung_switch).state;
      Color btn_bg = grid_on ? id(my_green) : id(my_red);

      it.filled_rectangle(170, 135, 140, 90, btn_bg);
      it.rectangle(170, 135, 140, 90, id(my_white));
      it.print(240, 148, id(font_header), id(my_white), TextAlign::CENTER, "ZULEITUNG");

      if (grid_on) {
        it.print(240, 175, id(font_val_large), id(my_white), TextAlign::CENTER, "EIN");
        it.print(240, 204, id(font_val_small), id(my_white), TextAlign::CENTER, "[Tippen: AUS]");
      } else {
        it.print(240, 175, id(font_val_large), id(my_white), TextAlign::CENTER, "AUS");
        it.print(240, 204, id(font_val_small), id(my_white), TextAlign::CENTER, "[Tippen: EIN]");
      }

# 8. Display-Hintergrundbeleuchtung (GPIO27)
output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm

light:
  - platform: monochromatic
    name: "CYD Backlight"
    output: backlight_pwm
    id: cyd_backlight
    restore_mode: ALWAYS_ON