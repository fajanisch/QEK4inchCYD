  - id: update_rest
    mode: restart
    then:
      - lambda: |-
          float rest = id(ext_rest_power).state;
          if (isnan(rest)) rest = 0;
          int val = (int)round(rest);
          lv_label_set_text_fmt(id(lbl_ext_rest), "%d W", val);
          lv_obj_set_style_text_color(id(lbl_ext_rest), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          lv_obj_invalidate(id(lbl_ext_rest));

  - id: power_detail_timeout
    mode: restart
    then:
      - delay: 60s
      - lvgl.widget.update:
          id: screen_power_detail
          hidden: true
      - lvgl.widget.update:
          id: screen_climate_detail
          hidden: true


- id: update_forecast_display
    then:
      - lambda: |-
          auto cond_to_icon = [](const std::string& cond) -> const char* {
            if (cond == "sunny" || cond == "clear-day") return "\U0000E81A";
            if (cond == "clear-night") return "\U0000E51C";
            if (cond == "partlycloudy") return "\U0000F172";
            if (cond == "rainy" || cond == "pouring") return "\U0000F176";
            if (cond == "lightning" || cond == "lightning-rainy") return "\U0000EBDB";
            if (cond == "snowy" || cond == "snowy-rainy") return "\U0000EB3B";
            if (cond == "windy" || cond == "windy-variant") return "\U0000EFD8";
            if (cond == "cloudy" || cond == "fog") return "\U0000E2BD";
            return "\U0000E2BD";
          };

          auto set_block = [&](lv_obj_t* lbl_top, lv_obj_t* lbl_icon, lv_obj_t* lbl_temp,
                               const std::string& top_raw, const std::string& temp_raw,
                               const std::string& cond_raw, const char* fallback_top,
                               bool is_daily) {
            std::string top_str = top_raw;
            if (top_str.empty() || top_str == "unavailable" || top_str == "unknown") {
              top_str = fallback_top;
            }
            lv_label_set_text(lbl_top, top_str.c_str());
            lv_obj_set_style_text_color(lbl_top, lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_invalidate(lbl_top);

            lv_label_set_text(lbl_icon, cond_to_icon(cond_raw));
            lv_obj_invalidate(lbl_icon);

            if (temp_raw.empty() || temp_raw == "unavailable" || temp_raw == "unknown") {
              lv_label_set_text(lbl_temp, is_daily ? "--/--°" : "--°");
            } else if (is_daily) {
              lv_label_set_text(lbl_temp, temp_raw.c_str());
            } else {
              char buf[16];
              float t = atof(temp_raw.c_str());
              int rounded = static_cast<int>(t + (t >= 0.0f ? 0.5f : -0.5f));
              snprintf(buf, sizeof(buf), "%d°", rounded);
              lv_label_set_text(lbl_temp, buf);
            }
            lv_obj_invalidate(lbl_temp);
          };

          // Hourly oben
          set_block(id(lbl_h1_time), id(icon_h1_cond), id(lbl_h1_temp),
                    id(ha_f_h1_time).state, id(ha_f_h1_temp).state, id(ha_f_h1_cond).state, "--:--", false);
          set_block(id(lbl_h2_time), id(icon_h2_cond), id(lbl_h2_temp),
                    id(ha_f_h2_time).state, id(ha_f_h2_temp).state, id(ha_f_h2_cond).state, "--:--", false);
          set_block(id(lbl_h3_time), id(icon_h3_cond), id(lbl_h3_temp),
                    id(ha_f_h3_time).state, id(ha_f_h3_temp).state, id(ha_f_h3_cond).state, "--:--", false);
          set_block(id(lbl_h4_time), id(icon_h4_cond), id(lbl_h4_temp),
                    id(ha_f_h4_time).state, id(ha_f_h4_temp).state, id(ha_f_h4_cond).state, "--:--", false);

          // Daily unten (High/Low)
          set_block(id(lbl_d1_label), id(icon_d1_cond), id(lbl_d1_temp),
                    id(ha_f_d1_label).state, id(ha_f_d1_temp).state, id(ha_f_d1_cond).state, "--", true);
          set_block(id(lbl_d2_label), id(icon_d2_cond), id(lbl_d2_temp),
                    id(ha_f_d2_label).state, id(ha_f_d2_temp).state, id(ha_f_d2_cond).state, "--", true);
          set_block(id(lbl_d3_label), id(icon_d3_cond), id(lbl_d3_temp),
                    id(ha_f_d3_label).state, id(ha_f_d3_temp).state, id(ha_f_d3_cond).state, "--", true);
          set_block(id(lbl_d4_label), id(icon_d4_cond), id(lbl_d4_temp),
                    id(ha_f_d4_label).state, id(ha_f_d4_temp).state, id(ha_f_d4_cond).state, "--", true);