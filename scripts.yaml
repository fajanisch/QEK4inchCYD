script:
  - id: dim_inactivity_timer
    mode: restart
    then:
      - delay: 60s
      - light.turn_on:
          id: cyd_backlight
          brightness: 5%
      - lvgl.widget.update:
          id: dim_guard_overlay
          hidden: false
          clickable: true
      - lvgl.widget.update:
          id: dim_guard_overlay
          hidden: false
          clickable: true

  - id: power_detail_timeout
    mode: restart
    then:
      - delay: 60s
      - lvgl.widget.update:
          id: screen_power_detail
          hidden: true

  - id: update_ext_pwr_hero
    mode: restart
    then:
      - lambda: |-
          std::string st = id(ext_pwr_switch_state).state;
          for (auto &c : st) c = tolower(c);

          float pwr = id(ext_pwr_watt).state;
          float cur = id(ext_pwr_current).state;

          if (st == "on") {
            lv_obj_add_flag(id(icon_ext_pwr_hero), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_ext_pwr_watt), LV_OBJ_FLAG_HIDDEN);

            if (!isnan(pwr)) {
              lv_label_set_text_fmt(id(lbl_ext_pwr_watt), "%.0f W", pwr);
            } else {
              lv_label_set_text(id(lbl_ext_pwr_watt), "0 W");
            }

            uint32_t col = 0x38BDF8;
            if (!isnan(cur)) {
              if (cur >= 8.5f) {
                col = 0xEF4444;
              } else if (cur >= 6.0f) {
                col = 0xFBBF24;
              }
            }
            lv_obj_set_style_text_color(id(lbl_ext_pwr_watt), lv_color_hex(col), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_pwr_card), lv_color_hex(col), LV_PART_MAIN);

          } else if (st == "off") {
            lv_obj_add_flag(id(lbl_ext_pwr_watt), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(icon_ext_pwr_hero), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_text_color(id(icon_ext_pwr_hero), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_pwr_card), lv_color_hex(0x38BDF8), LV_PART_MAIN);

          } else {
            lv_obj_add_flag(id(lbl_ext_pwr_watt), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(icon_ext_pwr_hero), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_text_color(id(icon_ext_pwr_hero), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_pwr_card), lv_color_hex(0x64748B), LV_PART_MAIN);
          }

          lv_obj_invalidate(id(lbl_ext_pwr_watt));
          lv_obj_invalidate(id(icon_ext_pwr_hero));
          lv_obj_invalidate(id(icon_ext_pwr_card));

  - id: update_shelly_bat
    mode: restart
    then:
      - lambda: |-
          std::string st = id(ext_bat_switch_state).state;
          for (auto &c : st) c = tolower(c);
          float pwr = id(ext_bat_power).state;
          float wh  = id(ext_bat_wh).state; // Tagesenergie-Sensor aus sensors.yaml

          // Optional: Falls du einen Lock-Zustand hast (sonst vorerst false)
          bool locked = false; 

          int val = (st == "on" && !isnan(pwr) && pwr > 1.0f) ? (int)round(pwr) : 0;
          int wh_val = (!isnan(wh)) ? (int)round(wh) : 0;

          // --- 1. HAUPTKACHEL (POWER) ---
          if (st == "on") {
            lv_label_set_text_fmt(id(lbl_ext_bat), "%d W", val);
            lv_obj_set_style_text_color(id(lbl_ext_bat), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_bat), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else if (st == "off") {
            lv_label_set_text(id(lbl_ext_bat), "Off");
            lv_obj_set_style_text_color(id(lbl_ext_bat), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_bat), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(lbl_ext_bat), "--");
            lv_obj_set_style_text_color(id(lbl_ext_bat), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_bat), lv_color_hex(0x64748B), LV_PART_MAIN);
          }

          // --- 2. SUBSCREEN KACHEL (btn_sub_bat) ---
          if (st != "on" && st != "off") {
            // ZUSTAND 1: Unavailable
            lv_label_set_text(id(lbl_sub_bat_pwr), "-- W");
            lv_label_set_text(id(lbl_sub_bat_energy), "-- Wh");
            lv_label_set_text(id(icon_sub_bat_state), "\uE646"); // power_off

            lv_obj_set_style_text_color(id(icon_sub_bat_loc), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_name), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_energy), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_sub_bat_state), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_clear_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);

          } else if (locked) {
            // ZUSTAND 2: Locked
            lv_label_set_text_fmt(id(lbl_sub_bat_pwr), "%d W", val);
            lv_label_set_text_fmt(id(lbl_sub_bat_energy), "%d Wh", wh_val);
            lv_label_set_text(id(icon_sub_bat_state), "\uE897"); // lock

            uint32_t col = (st == "on") ? 0x38BDF8 : 0x64748B;
            lv_obj_set_style_text_color(id(icon_sub_bat_loc), lv_color_hex(col), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_name), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_pwr), lv_color_hex(col), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_energy), lv_color_hex(col), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_sub_bat_state), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            lv_obj_clear_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);

          } else if (st == "off") {
            // ZUSTAND 3: Off
            lv_label_set_text(id(lbl_sub_bat_pwr), "Off");
            lv_label_set_text_fmt(id(lbl_sub_bat_energy), "%d Wh", wh_val);
            lv_label_set_text(id(icon_sub_bat_state), "\uE197"); // Power-Button Icon

            lv_obj_set_style_text_color(id(icon_sub_bat_loc), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_name), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_pwr), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_energy), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_sub_bat_state), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_add_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);

          } else {
            // ZUSTAND 4: On
            lv_label_set_text_fmt(id(lbl_sub_bat_pwr), "%d W", val);
            lv_label_set_text_fmt(id(lbl_sub_bat_energy), "%d Wh", wh_val);
            lv_label_set_text(id(icon_sub_bat_state), "\uE197"); // Power-Button Icon

            lv_obj_set_style_text_color(id(icon_sub_bat_loc), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_name), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_pwr), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_sub_bat_energy), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_sub_bat_state), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_add_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);
          }

          lv_obj_invalidate(id(lbl_ext_bat));
          lv_obj_invalidate(id(icon_ext_bat));
          lv_obj_invalidate(id(icon_sub_bat_loc));
          lv_obj_invalidate(id(lbl_sub_bat_name));
          lv_obj_invalidate(id(lbl_sub_bat_pwr));
          lv_obj_invalidate(id(lbl_sub_bat_energy));
          lv_obj_invalidate(id(icon_sub_bat_state));

  - id: update_shelly_kitchen
    mode: restart
    then:
      - lambda: |-
          std::string st = id(ext_kitchen_switch_state).state;
          for (auto &c : st) c = tolower(c);
          float pwr = id(ext_kitchen_power).state;

          if (st == "on") {
            int val = (!isnan(pwr) && pwr > 1.0) ? (int)round(pwr) : 0;
            lv_label_set_text_fmt(id(lbl_ext_kitchen), "%d W", val);
            lv_obj_set_style_text_color(id(lbl_ext_kitchen), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_kitchen), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else if (st == "off") {
            lv_label_set_text(id(lbl_ext_kitchen), "Off");
            lv_obj_set_style_text_color(id(lbl_ext_kitchen), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_kitchen), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(lbl_ext_kitchen), "--");
            lv_obj_set_style_text_color(id(lbl_ext_kitchen), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_kitchen), lv_color_hex(0x64748B), LV_PART_MAIN);
          }
          lv_obj_invalidate(id(lbl_ext_kitchen));
          lv_obj_invalidate(id(icon_ext_kitchen));

  - id: update_shelly_cooker
    mode: restart
    then:
      - lambda: |-
          std::string st = id(ext_cooker_switch_state).state;
          for (auto &c : st) c = tolower(c);
          float pwr = id(ext_cooker_power).state;

          if (st == "on") {
            int val = (!isnan(pwr) && pwr > 1.0) ? (int)round(pwr) : 0;
            lv_label_set_text_fmt(id(lbl_ext_cooker), "%d W", val);
            lv_obj_set_style_text_color(id(lbl_ext_cooker), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_cooker), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else if (st == "off") {
            lv_label_set_text(id(lbl_ext_cooker), "Off");
            lv_obj_set_style_text_color(id(lbl_ext_cooker), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_cooker), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(lbl_ext_cooker), "--");
            lv_obj_set_style_text_color(id(lbl_ext_cooker), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_cooker), lv_color_hex(0x64748B), LV_PART_MAIN);
          }
          lv_obj_invalidate(id(lbl_ext_cooker));
          lv_obj_invalidate(id(icon_ext_cooker));

  - id: update_shelly_climate
    mode: restart
    then:
      - lambda: |-
          std::string st = id(ext_climate_switch_state).state;
          for (auto &c : st) c = tolower(c);
          float pwr = id(ext_climate_power).state;

          if (st == "on") {
            int val = (!isnan(pwr) && pwr > 1.0) ? (int)round(pwr) : 0;
            lv_label_set_text_fmt(id(lbl_ext_climate), "%d W", val);
            lv_obj_set_style_text_color(id(lbl_ext_climate), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_climate), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else if (st == "off") {
            lv_label_set_text(id(lbl_ext_climate), "Off");
            lv_obj_set_style_text_color(id(lbl_ext_climate), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_climate), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(lbl_ext_climate), "--");
            lv_obj_set_style_text_color(id(lbl_ext_climate), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_climate), lv_color_hex(0x64748B), LV_PART_MAIN);
          }
          lv_obj_invalidate(id(lbl_ext_climate));
          lv_obj_invalidate(id(icon_ext_climate));

  - id: update_rest
    mode: restart
    then:
      - lambda: |-
          float rest = id(ext_rest_power).state;
          if (isnan(rest)) rest = 0;
          int val = (int)round(rest);
          lv_label_set_text_fmt(id(lbl_ext_rest), "%d W", val);
          lv_obj_set_style_text_color(id(lbl_ext_rest), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          lv_obj_invalidate(id(lbl_ext_rest));
