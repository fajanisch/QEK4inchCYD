    mode: restart
    then:
      - lambda: |-
          std::string st = id(ext_pwr_switch_state).state;
          for (auto &c : st) c = tolower(c);
          float pwr = id(ext_pwr_watt).state;
          float cur = id(ext_pwr_current).state;
          float wh  = id(ext_pwr_wh).state;
