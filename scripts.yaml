script:
  - id: dim_inactivity_timer
    mode: restart
    then:
      - delay: 60s
      - light.turn_on:
          id: cyd_backlight
          brightness: 5%
      - lvgl.widget.update:
          id: dim_guard_overlay
          hidden: false
          clickable: true
      - lvgl.widget.update:
          id: dim_guard_overlay
          hidden: false
          clickable: true

  # ==========================================
  # 1. BATTERY CHARGER
  # ==========================================
  - id: update_shelly_bat
    mode: restart
    then:
      - lambda: |-
          std::string st = id(ext_bat_switch_state).state;
          for (auto &c : st) c = tolower(c);
          float pwr = id(ext_bat_power).state;
          float wh  = id(ext_bat_wh).state;
          bool locked = false; // oder id(lock_sub_bat).state falls vorhanden

          int val = (st == "on" && !isnan(pwr) && pwr > 1.0f) ? (int)round(pwr) : 0;
          int wh_val = (!isnan(wh)) ? (int)round(wh) : 0;

          // Hauptkachel
          if (st == "on") {
            lv_label_set_text_fmt(id(lbl_ext_bat), "%d W", val);
            lv_obj_set_style_text_color(id(lbl_ext_bat), lv_color_hex(0xFBBF24), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_bat), lv_color_hex(0xFBBF24), LV_PART_MAIN);
          } else if (st == "off") {
            lv_label_set_text(id(lbl_ext_bat), "Off");
            lv_obj_set_style_text_color(id(lbl_ext_bat), lv_color_hex(0x38BDF8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_bat), lv_color_hex(0x38BDF8), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(lbl_ext_bat), "--");
            lv_obj_set_style_text_color(id(lbl_ext_bat), lv_color_hex(0x64748B), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(icon_ext_bat), lv_color_hex(0x64748B), LV_PART_MAIN);
          }

          // Subscreen Kachel (Variante A)
          uint32_t fg_col = 0x64748B;
          uint32_t border_col = 0x334155;

          if (st != "on" && st != "off") {
            lv_label_set_text(id(lbl_sub_bat_pwr), "-- W");
            lv_label_set_text(id(lbl_sub_bat_energy), "-- Wh");
            lv_label_set_text(id(icon_sub_bat_state), "\uE646");
            fg_col = 0x64748B; border_col = 0x334155;
            lv_obj_clear_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);
          } else if (locked) {
            lv_label_set_text_fmt(id(lbl_sub_bat_pwr), st == "on" ? "%d W" : "Off", val);
            lv_label_set_text_fmt(id(lbl_sub_bat_energy), "%d Wh", wh_val);
            lv_label_set_text(id(icon_sub_bat_state), "\uE897");
            fg_col = 0xEF4444; border_col = 0xEF4444;
            lv_obj_clear_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);
          } else if (st == "off") {
            lv_label_set_text(id(lbl_sub_bat_pwr), "Off");
            lv_label_set_text_fmt(id(lbl_sub_bat_energy), "%d Wh", wh_val);
            lv_label_set_text(id(icon_sub_bat_state), "\uE8AC");
            fg_col = 0x38BDF8; border_col = 0x334155;
            lv_obj_add_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);
          } else {
            lv_label_set_text_fmt(id(lbl_sub_bat_pwr), "%d W", val);
            lv_label_set_text_fmt(id(lbl_sub_bat_energy), "%d Wh", wh_val);
            lv_label_set_text(id(icon_sub_bat_state), "\uE8AC");
            fg_col = 0xFBBF24; border_col = 0xFBBF24;
            lv_obj_add_flag(id(btn_sub_bat), LV_OBJ_FLAG_CLICKABLE);
          }

          lv_obj_set_style_border_color(id(btn_sub_bat), lv_color_hex(border_col), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_sub_bat_loc), lv_color_hex(fg_col), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_sub_bat_name), lv_color_hex(fg_col), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_sub_bat_pwr), lv_color_hex(fg_col), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_sub_bat_energy), lv_color_hex(fg_col), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_sub_bat_state), lv_color_hex(fg_col), LV_PART_MAIN);
          lv_obj_invalidate(id(btn_sub_bat));

