esphome:
  name: sniffer433-8266
  friendly_name: "433MHz RF Sniffer ESP8266"

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

logger:
  level: DEBUG

# 433MHz SRX882S superheterodyne receiver on D2 (GPIO4)
remote_receiver:
  pin:
    number: GPIO4
    mode:
      input: true
      pullup: true
  dump:
    - rc_switch
    - raw
  tolerance: 50%
  filter: 50us
  idle: 4ms