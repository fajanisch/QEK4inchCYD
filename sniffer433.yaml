esphome:
  name: rf-sniffer
  friendly_name: "433MHz RF Sniffer"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

# 433MHz SRX882S superheterodyne receiver on GPIO27
remote_receiver:
  pin:
    number: GPIO27
  dump:
    - rc_switch
    - raw
  tolerance: 50%
  filter: 250us
  idle: 4ms