esphome:
  name: sniffer433
  friendly_name: "433MHz RF Sniffer"
  platformio_options:
    upload_speed: 115200

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: arduino

# Wi-Fi connection using credentials from secrets.yaml
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot in case Wi-Fi connection fails
  ap:
    ssid: "Sniffer433 Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

# Enable Home Assistant API & wireless OTA updates
api:
ota:
  - platform: esphome

logger:
  level: DEBUG
  baud_rate: 115200

# 433MHz SRX882S superheterodyne receiver on GPIO27
remote_receiver:
  pin:
    number: GPIO27
  dump:
    - rc_switch
    - raw
  tolerance: 50%
  filter: 250us
  idle: 4ms